<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>ManagerCycling Stats</title>
<meta name="description" content="Resultados, corredores, equipos e inscripciones del foro Managercycling.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: sticky navy race-bar header, then a two-column results/sidebar grid that stacks on phones. */
:root {
  --bg: #eceef2;
  --surface: #ffffff;
  --surface-2: #f5f6f9;
  --ink: #141924;
  --muted: #5e6879;
  --line: #dfe3ea;
  --line-2: #eef0f4;
  --accent: #2141c8;
  --accent-soft: #e6ebff;
  --bar: #101a3d;
  --bar-ink: #e9edff;
  --bar-muted: #9aa6d6;
  --gc: #f2c400;
  --pts: #1d9a55;
  --kom: #d42a3c;
  --you: #ffffff;
  --gold: #c99a06;
  --silver: #8b96a5;
  --bronze: #a8653a;
  --good: #1d8a4b;
  --warn: #b26b00;
  --live: #d42a3c;
  --hl: #fff6cc;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1017; --surface: #151a24; --surface-2: #1b2130; --ink: #e7eaf1; --muted: #98a2b5; --line: #273043; --line-2: #1e2534;
    --accent: #8ea2ff; --accent-soft: #1f2a52; --bar: #0a1230; --bar-ink: #e9edff; --bar-muted: #8f9bcb;
    --gc: #f2c400; --pts: #34c47a; --kom: #ff5a6a; --you: #e9edf5; --good: #4cd38a; --warn: #f0a83a; --live: #ff5a6a; --hl: #3a3416;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1017; --surface: #151a24; --surface-2: #1b2130; --ink: #e7eaf1; --muted: #98a2b5; --line: #273043; --line-2: #1e2534;
  --accent: #8ea2ff; --accent-soft: #1f2a52; --bar: #0a1230; --bar-ink: #e9edff; --bar-muted: #8f9bcb;
  --gc: #f2c400; --pts: #34c47a; --kom: #ff5a6a; --you: #e9edf5; --good: #4cd38a; --warn: #f0a83a; --live: #ff5a6a; --hl: #3a3416;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.strong { font-weight: 700; }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink); }
.bar-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.logo { display: flex; align-items: baseline; gap: 6px; color: var(--bar-ink); font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.logo:hover { text-decoration: none; }
.logo b { background: var(--gc); color: #121212; padding: 2px 6px 1px; border-radius: 3px; font-size: 18px; letter-spacing: .06em; transform: translateY(-2px); }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav a { color: var(--bar-muted); font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .03em; text-transform: uppercase; padding: 6px 10px; border-radius: 6px; }
.nav a:hover { color: var(--bar-ink); background: rgba(255,255,255,.07); text-decoration: none; }
.nav a.on { color: var(--bar-ink); box-shadow: inset 0 -3px 0 var(--gc); border-radius: 6px 6px 0 0; }
.bar-r { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search { position: relative; }
.search input { width: 240px; max-width: 60vw; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.14); color: var(--bar-ink); border-radius: 8px; padding: 7px 10px; font: inherit; }
.search input::placeholder { color: var(--bar-muted); }
.qres { position: absolute; right: 0; top: calc(100% + 6px); width: min(380px, 92vw); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 14px 40px rgba(10,15,30,.25); padding: 6px; z-index: 30; }
.qres a { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; color: var(--ink); }
.qres a.on, .qres a:hover { background: var(--accent-soft); text-decoration: none; }
.qres .qk { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 62px; flex: none; }
.qres .muted { margin-left: auto; }
select#season { background: rgba(255,255,255,.09); color: var(--bar-ink); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 7px 8px; font: inherit; }
select#season option { color: #111; }
.rf { display: inline-flex; align-items: center; gap: 6px; background: var(--gc); color: #15120a; border: 0; border-radius: 8px; padding: 7px 12px; font-family: var(--f-display); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .03em; cursor: pointer; }
.rf:hover { filter: brightness(1.06); }
.rf:disabled { opacity: .75; cursor: progress; }
.rf svg { width: 16px; height: 16px; }
.rf.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .rf.busy svg { animation: none; } }
.live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--bar-muted); }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bar-muted); flex: none; }
.live-ok .dot { background: #4cd38a; }
.live-busy .dot { background: var(--gc); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .live-busy .dot { animation: none; } }

/* page */
main { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 60px; }
.grid { display: grid; gap: 18px; align-items: start; }
.g-home { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.g-race { grid-template-columns: minmax(0, 1fr) minmax(0, 300px); }
.g-rider { grid-template-columns: minmax(0, 1fr) minmax(0, 340px); }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
@media (max-width: 900px) { .g-home, .g-race, .g-rider { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 5vw, 46px); line-height: 1.02; margin: 4px 0 6px; letter-spacing: .005em; text-wrap: balance; }
.h2 { font-family: var(--f-display); font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 6px; line-height: 1.1; }
.card-h .h2 { margin: 0; }
.h3 { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0; line-height: 1.1; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.more { font-size: 13px; font-weight: 600; }
.ph { margin-bottom: 14px; }
.ph-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.ph-team { font-size: 17px; margin: 0; }
.empty { color: var(--muted); padding: 8px 0; list-style: none; }
.prose p { max-width: 68ch; }

/* hero */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 14px; margin-bottom: 18px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--gc) 0 25%, var(--pts) 25% 50%, var(--kom) 50% 75%, var(--accent) 75%); }
.hero-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.hero-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 6vw, 56px); line-height: 1; margin: 8px 0 2px; text-wrap: balance; }
.hero-title a { color: var(--ink); }
.hero-sub { margin: 0 0 12px; color: var(--muted); }
.podium { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .podium { grid-template-columns: minmax(0, 1fr); } }
.pd { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.pd-pos { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; width: 30px; text-align: center; flex: none; }
.pd1 .pd-pos { color: var(--gold); } .pd2 .pd-pos { color: var(--silver); } .pd3 .pd-pos { color: var(--bronze); }
.pd-who { display: flex; flex-direction: column; min-width: 0; }
.pd-who .rl { font-weight: 700; font-size: 16px; }
.pd-team { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pd-v { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.li-race { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line-2); }
.li-race:first-child { border-top: 0; }
.li-date { font-family: var(--f-display); font-weight: 600; font-size: 16px; color: var(--muted); width: 74px; flex: none; text-transform: uppercase; letter-spacing: .02em; }
.li-main { min-width: 0; flex: 1; }
.li-sub { font-size: 13px; color: var(--muted); }
.el { font-weight: 700; color: var(--ink); }
.rl { color: var(--ink); font-weight: 600; }
.tl { color: var(--muted); }
.tl.strongish { color: var(--ink); font-weight: 600; }
a.rl:hover, a.tl:hover, a.el:hover { color: var(--accent); }
.sub { font-size: 12px; }

/* badges */
.cb { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; vertical-align: 2px; border: 1px solid var(--line); color: var(--muted); background: var(--surface-2); white-space: nowrap; }
.cb-wt1 { background: var(--bar); color: var(--gc); border-color: var(--bar); }
.cb-wt2 { background: var(--accent); color: #fff; border-color: var(--accent); }
.cb-pro { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.cc { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.jb { display: inline-block; font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; margin-left: 5px; vertical-align: 1px; line-height: 1.35; }
.jb-l { font-size: 12px; padding: 1px 6px; margin: 0; }
.off-badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--ok, #1a7f37); border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; margin-left: 6px; white-space: nowrap; }
.sp { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 99px; white-space: nowrap; flex: none; }
.sp-done { color: var(--muted); background: var(--surface-2); }
.sp-live { color: #fff; background: var(--live); }
.sp-next { color: var(--accent); background: var(--accent-soft); }
.sp-wait { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-left: 6px; }
.wn { font-size: 11px; font-weight: 700; color: var(--good); margin-left: 6px; }
.jy { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.15); flex: none; }
.jy-GC { background: var(--gc); }
.jy-PTS { background: var(--pts); }
.jy-KOM { background: radial-gradient(circle at 3px 3px, var(--kom) 1.6px, transparent 1.8px) 0 0/6px 6px, #fff; }
.jy-YOU { background: var(--you); }
.jy-TEAM { background: var(--muted); }
.jy-TOT { background: var(--accent); }
.ti { display: inline-flex; color: var(--muted); vertical-align: -3px; margin-right: 4px; }
.ti svg { width: 26px; height: 15px; }

/* tables */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.t tbody tr:hover td { background: var(--surface-2); }
.t tr.hl td { background: var(--hl); }
.t-compact td { padding: 5px 6px; }
.t-res td.v { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-res td.team, .t-rank td.team { color: var(--muted); }
.t td.rider { white-space: nowrap; }
.pos { display: inline-block; min-width: 26px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.pos.p1 { color: #1a1300; background: var(--gc); border-radius: 4px; }
.pos.p2 { color: var(--silver); }
.pos.p3 { color: var(--bronze); }
.pts { font-weight: 600; }
.t-rider .d { color: var(--muted); white-space: nowrap; font-size: 13px; }
.t-rider tr.rr td { border-top: 1px solid var(--line); }
.t-rider tr.rs td { border-bottom: 0; padding-top: 2px; padding-bottom: 2px; font-size: 13px; }
.t-rider tr.rs .pos { font-size: 15px; }
.t-cal td { padding: 7px 8px; }
.t-cal .d { width: 110px; color: var(--muted); white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 16px; text-transform: uppercase; }
.t-cal .cal-s { text-align: right; width: 1%; }
.t-cal tr.today td { background: var(--accent-soft); }
.cal { display: flex; flex-direction: column; gap: 14px; }

/* race page */
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 14px; border-bottom: 2px solid var(--line); scrollbar-width: thin; }
.tab { display: inline-flex; align-items: center; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); padding: 7px 10px; border-radius: 6px 6px 0 0; margin-bottom: -2px; border-bottom: 2px solid transparent; }
.tab:hover { color: var(--ink); text-decoration: none; background: var(--surface); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); background: var(--surface); }
.stage-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 2px 0 10px; }
.stage-h .ti svg { width: 40px; height: 22px; }
.stage-lead { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.filter input { width: 100%; max-width: 320px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 10px; font: inherit; margin-bottom: 10px; }
.jw, .sw, .wl { list-style: none; margin: 0; padding: 0; }
.jw li, .sw li, .wl li { display: grid; align-items: center; gap: 6px; padding: 5px 0; border-top: 1px solid var(--line-2); }
.jw li { grid-template-columns: 14px 84px minmax(0, 1fr) auto; }
.jw li:has(> .n) { grid-template-columns: 14px minmax(0, 1fr) auto; }
.sw li { grid-template-columns: 30px 28px minmax(0, 1fr); }
.wl li { grid-template-columns: 46px minmax(0, 1fr) auto; }
.wl li:has(> .jy) { grid-template-columns: 46px 14px minmax(0, 1fr) auto; }
.jw li > *, .sw li > *, .wl li > * { min-width: 0; }
.jw .jy, .wl .jy { margin: 0; }
.jw li:first-child, .sw li:first-child, .wl li:first-child { border-top: 0; }
.jw .n { text-align: right; }
.sw-l { font-family: var(--f-display); font-weight: 700; color: var(--muted); }
.sw .ti { margin: 0; }
.wl .li-date { width: auto; font-size: 14px; }
.wl .small { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.sl-team { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.sl-team header { display: flex; flex-direction: column; margin-bottom: 6px; }
.sl-team header .tl { color: var(--ink); font-weight: 700; }
.sl-team ol { list-style: none; margin: 0; padding: 0; }
.sl-team li { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 14px; }
.sl-team li.hl { background: var(--hl); border-radius: 4px; }
.bib { font-family: var(--f-display); font-weight: 600; color: var(--muted); width: 32px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }

/* rider */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; min-width: 0; }
.kpi-v { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi-l { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 4px; }
.kpi-s { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
.seg a { padding: 4px 10px; border-radius: 6px; color: var(--muted); font-weight: 600; font-size: 14px; }
.seg a:hover { text-decoration: none; color: var(--ink); }
.seg a.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg-wide { margin-bottom: 14px; }
.bars { width: 100%; height: auto; display: block; }
.bars .bar { fill: var(--accent); }
.bars .bar-0 { fill: var(--line); }
.bars .ax { fill: var(--muted); font-size: 10px; text-anchor: middle; font-family: var(--f-body); }
.bars .bl { fill: #fff; font-size: 9px; text-anchor: middle; font-weight: 700; font-family: var(--f-body); }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .filter input { margin: 0; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 14px; }

.dz { font-variant-numeric: tabular-nums; }
.dz small { font-size: 11px; color: var(--muted); margin-left: 2px; }
.dz-near { color: var(--warn); font-weight: 700; }
.dz-over { color: var(--live); font-weight: 700; }
.sl-team .dz { font-size: 11px; margin-left: 6px; }
.kpi-of { font-size: 18px; color: var(--muted); font-weight: 600; }
.kpi-s .warn { color: var(--live); }

/* head to head */
.h2h-f input { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 10px; font: inherit; }
.h2h { display: grid; grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1fr); gap: 8px; align-items: center; margin: 12px 0 4px; }
.h2h-s { display: flex; flex-direction: column; min-width: 0; font-size: 13px; }
.h2h-s strong { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.h2h-r { text-align: right; align-items: flex-end; }
.h2h-bar { height: 8px; border-radius: 4px; background: var(--kom); overflow: hidden; }
.h2h-bar span { display: block; height: 100%; background: var(--accent); }

/* home extras */
.form { list-style: none; margin: 0; padding: 0; }
.form li { display: grid; grid-template-columns: minmax(0, 1fr) 90px 52px; gap: 8px; align-items: center; padding: 4px 0; }
.fm-bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--pts) var(--w), var(--line-2) var(--w)); }

/* stats */
.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.lb { list-style: none; margin: 0; padding: 0; }
.lb li { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line-2); }

<script>
// Line-level parser for Managercycling forum topics. Pure functions, no DOM.
// Input: posts = [{a: author, tm: profile team, d: date string, L: [lines]}], topic title.
(function (G) {
  const norm = s => (s || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const fold = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ø/g, 'o').replace(/æ/g, 'ae').replace(/ß/g, 'ss').replace(/ł/g, 'l').replace(/đ/g, 'd').toLowerCase();
  const riderKey = s => fold(String(s).replace(/\(J\)/gi, ' ')).replace(/[^a-z0-9]+/g, ' ').trim();
  const tokenKey = s => riderKey(s).split(' ').filter(Boolean).sort().join(' ');
  const teamKey = s => fold(s).replace(/[^a-z0-9]+/g, '');

  // ---------- titles ----------
  const CLS_RE = /^(\d\.[A-Za-z0-9]+|[A-Z]{2,4}\.[A-Z0-9]+|NC|CN|CC|JJOO|WC|CM|GT|HC)$/;
  function parseTitle(t) {
    t = norm(t);
    let note = null;
    const nm = t.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if (nm && /\d{4}/.test(nm[1])) { t = nm[1]; note = nm[2]; }
    const m = t.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})\d?(?:\s*[-–]?\s*(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})\d?)?\s+(.+)$/);
    if (!m) return { name: t, start: null, end: null, country: null, cls: null, note };
    const d = (a, b, c) => `${c}-${String(b).padStart(2, '0')}-${String(a).padStart(2, '0')}`;
    let parts = m[7].split(' '), cls = null, country = null;
    for (let k = 0; k < 3 && parts.length > 1; k++) {
      const last = parts[parts.length - 1];
      if (!cls && CLS_RE.test(last)) { cls = parts.pop(); continue; }
      if (!country && /^[A-Z]{3}$/.test(last)) { country = parts.pop(); continue; }
      if (/^(ME|MU|MJ|WE)$/.test(last)) { parts.pop(); continue; }
      break;
    }
    let start = d(m[1], m[2], m[3]), end = m[4] ? d(m[4], m[5], m[6]) : null;
    if (end === start) end = null;
    return { name: parts.join(' '), start, end, country, cls, note };
  }

  // ---------- headers ----------
  const SEC = [
    ['TOTR', /^(total(es)? (ciclistas|corredores)|(total |puntos )?por (ciclista|corredor)(es|s)?|ciclistas|corredores)$/],
    ['TOT', /^(total|totales|puntos totales|total equipos|puntos equipos|puntos por equipos?|presupuesto)$/],
    ['GC', /^(general|resto de general|resto general|clasificacion general|general final|rojo|maillot rojo|rosa|maglia rosa|jaune|maillot jaune|amarillo|maillot amarillo|lider|gc)$/],
    ['PTS', /^(puntos|regularidad|clasificacion por puntos|ciclamino|maglia ciclamino|vert|maillot vert|verde|maillot verde|points)$/],
    ['KOM', /^(montana|clasificacion de la montana|azzurra|maglia azzurra|a pois|maillot a pois|lunares|pois|gpm|kom)$/],
    ['YOU', /^(jovenes|clasificacion jovenes|bianca|maglia bianca|blanc|maillot blanc|blanco|maillot blanco|sub ?23|young)$/],
    ['TEAM', /^(equipos|clasificacion por equipos|super team|equipes|squadre|teams|equipo)$/],
    ['R', /^(etapa|etape|tappa|final|clasica|resultado|resultados|crono|cri|llegada|meta|spoiler|clasificacion|clasificacion etapa|stage|prologo|resultado final|ttt|cre|podium|podio|resto de clasificacion|resto clasificacion|resto de clasica|resto de etapa|puntos individuales|etapa y general)$/],
    ['IGN', /^(campeones|participantes|equipos participantes|escapada|lesion|prediccion|vamos|arranca|salida|todo listo|contrarreloj integra|clasica integra|etapa en vivo|etapa y favoritos|perfil|ganador|lesionad|startlist|start list|inscritos|video|directo|vamos al directo|fuga|ultimos|abandono|favoritos|nota|palmares|puntos:|prueba|etapa completa|etapa integra|crono integra|prologo integro|clasica completa|carrera completa|retirad|descalific|sancion|fuera de control|recorrido|horario|previa)/],
  ];
  function sectionOf(h, raceName) {
    const f = fold(h).replace(/\(.*?\)/g, ' ').replace(/[:.\-–!¡]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (raceName && f === fold(raceName).replace(/[:.\-–!¡]+/g, ' ').replace(/\s+/g, ' ').trim()) return 'TOT';
    for (const [k, re] of SEC) if (re.test(f)) return k;
    return null;
  }
  // "Etapa 3 - MON", "Etapa 1 | Mónaco > Mónaco (PRL COL)", "3ª ETAPA", "Tappa 4", "Clásica - COL", "Prólogo"
  function stageCtx(h) {
    const s = norm(h);
    let m = s.match(/^(?:etapa|[ée]tape|tappa|stage)\s*(\d{1,2})\s*(?:\.\s*)?([ab](?![a-z]))?(?:\s*(?:[-–|:]\s*|\s+)(.*))?$/i);
    if (m && !/^\d/.test(m[3] || '')) return { n: +m[1] + (m[2] ? (m[2].toLowerCase() === 'b' ? 0.5 : 0.25) : 0), rest: norm(m[3] || '') };
    m = s.match(/^(\d{1,2})\s*[ªºa]?\.?\s*etapa\b\s*[-–|:]?\s*(.*)$/i);
    if (m) return { n: +m[1], rest: norm(m[2]) };
    m = s.match(/^pr[óo]logo\b\s*[-–|:]?\s*(.*)$/i);
    if (m && !/integr|complet/i.test(s)) return { n: 0.1, rest: norm(m[1]), prologue: true };
    m = s.match(/^cl[áa]sica\s*[-–|:]\s*(.+)$/i);
    if (m) return { n: 0, rest: norm(m[1]) };
    return null;
  }
  const TYPE_RE = /\b(LLA PAV|LL PAV|MM PAV|COL PAV|LLA|LL|MM|MON|COL|CRI|CRE|PRL COL|PRL|PAV|ALT|CRO)\b/;
  function cleanRoute(rest) {
    let r = (rest || '').replace(/\((?:[A-Z ]+)\)\s*$/, '').replace(TYPE_RE, '').replace(/^[-–|:\s]+|[-–|:\s]+$/g, '');
    if (!/[>–-]|\s-\s/.test(r) && /^(llana|monta|media|alta|contrarreloj|crono|colinas|pr[oó]logo|pav)/i.test(r)) return null;
    return r || null;
  }
  function stageType(rest) {
    if (!rest) return null;
    const m = rest.match(TYPE_RE); if (m) return m[1];
    const f = fold(rest), pav = /pave|adoquin/.test(f) ? ' PAV' : '';
    if (/contrarreloj por equipos|crono por equipos|crono equipos|ttt/.test(f)) return 'CRE';
    if (/contrarreloj|crono|\bcri\b|\bitt\b/.test(f)) return 'CRI';
    if (/prologo/.test(f)) return 'PRL';
    if (/media montana|media-montana|accidentad|quebrad/.test(f)) return 'MM' + pav;
    if (/alta montana|montana|alto|puerto/.test(f)) return 'MON';
    if (/colin|ondulad/.test(f)) return 'COL' + pav;
    if (/llan|sprint/.test(f)) return 'LL' + pav;
    return pav ? 'PAV' : null;
  }

  // ---------- values ----------
  const TIME_TOK = /^(s\.?t\.?|m\.?t\.?|\+|\+?\d+h\d+'?\d*"?|\+?\d+'\d*"?|\+\d+"?|\d+h\d+'?\d*"?|\d+'\d*"?|\d+:\d{2}(:\d{2})?|\d+"|a|m\.?t\.?)$/i;
  const NUM_TOK = /^\d{1,3}(\.\d{3})+(,\d+)?$|^\d+(,\d+)?$/;
  const PAREN_TOK = /^\(\d+\)$/;
  const isValTok = t => TIME_TOK.test(t) || NUM_TOK.test(t) || PAREN_TOK.test(t) || /^(dnf|dns|otl|ab|abd|fc|-|–|=|=\+|\+=)$/i.test(t) || /^=\+?\d/.test(t);
  const toNum = t => { const v = parseFloat(t.replace(/\./g, '').replace(',', '.')); return Math.round(v * 1e6) / 1e6; };

  function splitValues(rest) {
    // rest = "Name Team 4h30'35" → [textPart, valuesPart]
    const toks = rest.split(' ');
    let i = toks.length;
    while (i > 0 && isValTok(toks[i - 1])) i--;
    // don't eat a team/rider name that ends in a number like "Team 7" — keep at least one word
    return [toks.slice(0, i).join(' '), toks.slice(i).join(' ')];
  }

  // ---------- teams ----------
  function TeamIndex() {
    const byKey = new Map(); // teamKey -> display
    let sorted = null;
    return {
      add(name) { name = norm(name); if (!name || name.length < 3) return; const k = teamKey(name); if (!k) return; if (!byKey.has(k)) { byKey.set(k, name); sorted = null; } },
      has(name) { return byKey.has(teamKey(name)); },
      get(name) { return byKey.get(teamKey(name)); },
      // find team at the END of text: returns [riderPart, team] or null
      splitEnd(text) {
        // longest team name that ends the text, compared without spaces/punctuation
        const words = norm(text).split(' ');
        for (let i = 0; i < words.length; i++) {
          const k = teamKey(words.slice(i).join(' '));
          if (k && byKey.has(k)) return [words.slice(0, i).join(' '), byKey.get(k)];

        return null;
      },
      all() { return [...byKey.values()]; },
      size() { return byKey.size; }
    };
  }

  // Learn team names from tabbed rows (unambiguous) across many topics.
  function learnTeams(topics, idx) {
    for (const x of topics) for (const p of x.posts) for (const l of p.L) {
      if (l.indexOf('\t') < 0 || /^\s*(spoiler:\s*)?l[ií]der\b/i.test(l)) continue;
      const c = l.split('\t').map(norm).filter(Boolean);
      const okTeam = x => x && /[A-Za-z]{2}/.test(x) && !x.split(' ').every(isValTok) && !/^[+(]/.test(x);
      if (c.length >= 4 && /^\d+$/.test(c[0]) && okTeam(c[2]) && okTeam(c[1])) idx.add(c[2]);
      else if (c.length === 3 && /^\d+$/.test(c[0]) && NUM_TOK.test(c[2]) && /team|cycling|pro|equipo|\-|\//i.test(c[1]) && c[1].split(' ').length >= 2) { /* maybe team row, skip */ }
      else if (c.length === 2 && NUM_TOK.test(c[1]) && okTeam(c[0]) && !/^\d+$/.test(c[0])) idx.add(c[0]);
      else if (c.length === 3 && okTeam(c[0]) && !/^\d+$/.test(c[0]) && NUM_TOK.test(c[2]) && okTeam(c[1])) idx.add(c[1]);
    }
  }

  // ---------- rows ----------
  function preSplit(line) {
    let l = line.replace(/\b([sm])\.\s+t\./gi, '$1.t.').replace(/^\s*spoiler:\s*/i, '').replace(/^\s*final\s*\(spoiler\):\s*/i, '');
    // "Clásica:1 Paul Lapeira ..." → header + row
    if (/^l[íi]der\b/i.test(l)) return [null, ''];
    // "Etapa 19 1 Tobias Halland Johannessen Lidl-Trek 480" → header + row
    const g = l.match(/^((?:etapa|stage)\s*\d+\s*(?:\.?\s*[ab](?![a-z]))?|pr[oó]logo)[\t ]+(\d+[.º]?[\t ]+\D.*)$/i);
    if (g) return [norm(g[1]), g[2]];
    // "Jóvenes 1 Lennert Van Eetvelt (J) Uno-X Mobility 60" → header + first row
    const h = l.match(/^([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .]{2,30}?)[\t ]+(1[.º]?[\t ]+\D.*)$/);
    if (h && (sectionOf(h[1]) || stageCtx(h[1]))) return [norm(h[1]), h[2]];
    const m = l.match(/^([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9() ]{2,30}?):+\s*(\d+[\t ].*)$/);
    if (m) return [m[1], m[2]];
    const t = l.match(/^([^\t\d][^\t]{1,40}?)\t+(\d+\t.*)$/);
    if (t && (stageCtx(t[1]) || sectionOf(t[1]))) return [t[1], t[2]];
    return [null, l];
  }

  function parseRow(line, sec, teams) {
    if (line.indexOf('\t') >= 0) {
      let c = line.split('\t').map(norm).filter(Boolean);
      let pos = null;
      if (/^\d+\.?$/.test(c[0]) && c.length >= 2) { pos = parseInt(c[0], 10); c = c.slice(1); }
      else { const pm = c[0].match(/^(\d+)\s*[.ºª)-]?\s+(\D.*)$/); if (pm) { pos = +pm[1]; c[0] = pm[2]; } }
      // merge trailing value cols
      let vi = c.length; while (vi > 1 && isValTok(c[vi - 1].split(' ')[0])) vi--;
      const names = c.slice(0, vi), vals = c.slice(vi).join(' ');
      if (!vals && pos == null) return null;
      if (names.length >= 2) return mkRow(pos, names[0], names[1], vals, teams);
      if (names.length === 1) {
        const n = names[0];
        if (sec === 'TEAM' || sec === 'TOT' || teams.has(n)) return mkRow(pos, null, n, vals, teams);
        const sp = teams.splitEnd(n);
        if (sp && sp[0]) return mkRow(pos, sp[0], sp[1], vals, teams);
        return mkRow(pos, n, null, vals, teams);
      }
      return null;
    }

  // ---------- topic → blocks ----------

            if (m) { const sp = teams.splitEnd(m[1]); leaderPts.set(ctx, { p: ctx, r: sp && sp[0] ? sp[0] : m[1], t: sp ? sp[1] : null, v: m[2], one: toNum(m[2]) }); continue; }

    let last = 0;

    out.forEach(b => { if (!byPost.has(b.post)) byPost.set(b.post, []); byPost.get(b.post).push(b); });

  // ---------- assemble race ----------

      const isP = isPointsBlock(b);

  function parseRaceTopic(topic, teams, log) {

        race.stages.push({ n, label: inf.prologue ? 'Prólogo' : 'Etapa ' + (Number.isInteger(n) ? n : Math.floor(n) + (n % 1 === 0.5 ? 'b' : 'a')), type: stageType(inf.rest) || (inf.prologue ? 'PRL' : null), route: cleanRoute(inf.rest), rows });

        const m = new Map(pro.rows.map(r => [rk(r), r]));
        e1.rows.forEach(r => { const o = m.get(rk(r)); if (o) o.pts = r.pts; });

      const rows = finalize(pickBase(bs, c === 'GC' || c === 'PTS' || c === 'KOM'));

  // ---------- inscriptions ----------
  const NOT_NAME = /https?:|\d{2}\/\d{2}|clasificaci|^\d+º|:$|corredores|puntos|palmar|equipo|mánager|manager|edici[oó]n|inscrip|^\d+$|^_{2,}|lesion|baja|alta|cambio|sustitu|^(ok|vale|gracias)/i;

        if (typeof process !== 'undefined' && process.env && process.env.MC_LOG_TEAMS) console.error('team merge', s, ids.map(t => data.teams[t]).join(' | '), '→', data.teams[keep]);
        const fix = w => { if (map.has(w[2])) w[2] = keep; };
        for (const r of data.races) if (r.s === s) { r.st.forEach(x => x.rows.forEach(fix)); for (const c in r.cl) r.cl[c].forEach(fix); }
        for (const i of data.ins) if (i.s === s) for (const e of i.e || []) if (map.has(teamId.get(MC.teamKey(e.t)))) e.t = data.teams[keep];
      }
    }

    // Crono por equipos: la clasificación oficial reparte los puntos del puesto del equipo (escala de la
    // carrera o de las etapas de esa categoría) a partes iguales entre sus corredores, sin redondear y sin
    // sumar la clasificación por equipos. El foro a veces publica el reparto redondeado o con los totales.
    function fixTTT(key) {
      const isTTT = rows => {
        if (rows.length < 6) return false;
        const shared = rows.filter((x, i) => i > 0 && x[0] === rows[i - 1][0] && x[2] === rows[i - 1][2] && x[2] >= 0).length;
        return shared > rows.length / 2;
      };
      const mode = m => { let best = null, bn = 0; for (const [v, n] of m) if (n > bn) { bn = n; best = v; } return [best, bn]; };
      // escala de etapas por categoría y temporada
      const stScale = new Map();
      for (const r of data.races) {
        if (!r.multi || !r.cls) continue;
        for (const s of r.st) {
          if (isTTT(s.rows) || s.rows.filter(x => x[4] != null).length < 10) continue;
          const c = stScale.get(key(r)) || new Map();
          for (const x of s.rows) if (x[4] != null && x[0] > 0 && x[0] <= 30) { const m = c.get(x[0]) || new Map(); m.set(x[4], (m.get(x[4]) || 0) + 1); c.set(x[0], m); }
          stScale.set(key(r), c);
        }
      }
      const insOf = r => data.ins.find(i => i.s === r.s && i.start === r.start && i.sc && MC.riderKey(i.name).split(' ')[0] === MC.riderKey(r.name).split(' ')[0] && (i.cls || '') === (r.cls || ''));
      let n = 0;
      for (const r of data.races) {
        if (+r.s < 2025) continue; // hasta 2024 la clasificación oficial usaba el reparto publicado
        for (const s of r.st) {
          if (!isTTT(s.rows)) continue;
          let S = null;
          if (!r.multi) { const i = insOf(r); if (i) S = p => i.sc[p - 1] ?? null; }
          else if (stScale.has(key(r))) { const c = stScale.get(key(r)); S = p => { const m = c.get(p); if (!m) return null; const [v, k] = mode(m); return k >= 3 ? v : null; }; }
          if (!S) continue;
          const groups = new Map();
          for (const x of s.rows) { if (x[1] < 0 || x[2] < 0) continue; const g = x[0] + ':' + x[2]; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(x); }
          for (const xs of groups.values()) {
            const v = S(xs[0][0]); if (v == null) continue;
            const each = v / xs.length, posted = xs[0][4];
            // sólo si lo publicado es ese reparto (redondeado) o el total del equipo con alguna clasificación extra
            if (posted != null && Math.abs(posted - each) > 0.01 && !(Math.abs(posted * xs.length - v) <= xs.length) && !(posted * xs.length > v && posted * xs.length - v <= v * 0.35)) continue;
            for (const x of xs) { if (x[4] !== each) { x[4] = Math.round(each * 1e6) / 1e6; n++; } }
          }
        }
      }
      return n;
    }

    // Same rider written two ways in results ("Natnael Tesfatsion" / "Natnael Tesfazion"): names one or two
    // letters apart, riding for the same team in the same season and never in the same race → one rider.
    function mergeDuplicates() {
      const N = data.riders.length;
      const races = Array.from({ length: N }, () => new Set()), teams = Array.from({ length: N }, () => new Set()), refs = new Array(N).fill(0);
      const each = fn => { for (const r of data.races) { r.st.forEach((s, si) => { for (const x of s.rows) fn(x, r, 's' + si); }); for (const k in r.cl) for (const x of r.cl[k]) fn(x, r, k); } };
      each((x, r, l) => { const i = x[1]; if (i >= 0 && i < N) { races[i].add(r.id + l); refs[i]++; if (x[2] >= 0) teams[i].add(r.s + ':' + x[2]); } });
      const keys = data.riders.map(r => MC.fold(r[0].replace(/\(J\)/gi, '')).replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim());
      const parent = Array.from({ length: N }, (_, i) => i);
      const find = i => { while (parent[i] !== i) i = parent[i] = parent[parent[i]]; return i; };
      const ids = keys.map((k, i) => i).filter(i => keys[i].length > 6 && refs[i] > 0);
      for (let a = 0; a < ids.length; a++) for (let b = a + 1; b < ids.length; b++) {
        const i = ids[a], j = ids[b];
        if (Math.abs(keys[i].length - keys[j].length) > 2 || keys[i][0] !== keys[j][0] && keys[i].split(' ').pop()[0] !== keys[j].split(' ').pop()[0]) continue;
        if (lev(keys[i], keys[j]) > 2) continue;
        if (![...teams[i]].some(t => teams[j].has(t))) continue;
        if ([...races[i]].some(r => races[j].has(r))) continue;
        const ri = find(i), rj = find(j); if (ri === rj) continue;
        if (oidOf.has(ri) && oidOf.has(rj) && oidOf.get(ri) !== oidOf.get(rj)) continue; // dos corredores distintos en la web oficial
        if (G.MC_LOG_MERGE) console.log("merge", data.riders[i][0], "=", data.riders[j][0]);
        if (oidOf.has(rj) && !oidOf.has(ri)) parent[ri] = rj; else if (oidOf.has(ri) && !oidOf.has(rj)) parent[rj] = ri;
        else if (refs[ri] >= refs[rj]) parent[rj] = ri; else parent[ri] = rj;
      }
      // riders only seen in inscriptions, misspelled: attach them to the one rider with results that is close enough
      const withRes = keys.map((k, i) => i).filter(i => refs[i] > 0 && keys[i].length > 6);
      for (let i = 0; i < N; i++) {
        if (refs[i] > 0 || keys[i].length <= 6) continue;
        const lim = keys[i].length > 12 ? 2 : 1;
        const c = withRes.filter(j => Math.abs(keys[i].length - keys[j].length) <= lim && lev(keys[i], keys[j]) <= lim);
        if (c.length === 1) parent[i] = find(c[0]);
      }
      if (parent.every((p, i) => p === i)) return;
      for (let i = 0; i < N; i++) { const m = find(i); if (m !== i) { for (const y of data.riders[i].slice(1)) if (!data.riders[m].includes(y, 1)) data.riders[m].push(y); for (const [n, c] of Object.entries(votes[i] || {})) votes[m][n] = (votes[m][n] || 0) + c; } }
      each(x => { if (x[1] >= 0) x[1] = find(x[1]); });
      for (const r of data.races) if (r.ld) for (const k in r.ld) if (r.ld[k] >= 0) r.ld[k] = find(r.ld[k]);
      for (const i of data.ins) for (const e of i.e) e.r = [...new Set(e.r.map(find))];
      // drop riders nobody refers to any more and renumber
      const used = new Set(); each(x => { if (x[1] >= 0) used.add(x[1]); });
      for (const r of data.races) if (r.ld) Object.values(r.ld).forEach(v => v >= 0 && used.add(v));
      for (const i of data.ins) for (const e of i.e) e.r.forEach(v => used.add(v));
      const map = new Map(); const riders = [], nv = [];
      data.riders.forEach((r, i) => { if (used.has(i)) { map.set(i, riders.length); riders.push(r); nv.push(votes[i]); } });
      const re = v => (v >= 0 ? map.get(v) ?? -1 : v);
      each(x => { x[1] = re(x[1]); });
      for (const r of data.races) if (r.ld) for (const k in r.ld) r.ld[k] = re(r.ld[k]);
      for (const i of data.ins) for (const e of i.e) e.r = e.r.map(re).filter(v => v >= 0);
      data.riders = riders; votes.length = 0; votes.push(...nv);
      const om = [...oidOf]; oidOf.clear(); ridOfOid.clear();
      for (const [i, o] of om) { const n = re(find(i)); if (n >= 0) { oidOf.set(n, o); ridOfOid.set(o, n); } }
      for (const r of data.races) if (r.dy) { const d = {}; for (const [k, v] of Object.entries(r.dy)) { const n = re(find(+k)); if (n >= 0) d[n] = (d[n] || 0) + v; } r.dy = d; }
      riderId.clear(); tokId.clear();
      data.riders.forEach((r, i) => { riderId.set(MC.riderKey(r[0]), i); tokId.set(MC.tokenKey(r[0]), i); });
    }

    return {
      data,
      addRace(r, replies) {
        curSeason = seasonOf(r);
        const o = { id: r.id, s: seasonOf(r), name: r.name, start: r.start, end: r.end, c: r.country, cls: r.cls, note: r.note || undefined, im: r.im || undefined, multi: r.multi ? 1 : 0, rp: replies, st: [], cl: {} };
        for (const s of r.stages) o.st.push({ n: s.n, l: s.label, ty: s.type || undefined, ro: s.route || undefined, im: s.im || undefined, rows: s.rows.map(rowOut) });
        // team totals often use short names ("Trek", "Ineos"): match them to the teams of this race
        const local = new Map(); for (const s of r.stages) for (const x of s.rows) if (x.t) local.set(MC.teamKey(x.t), x.t);
        for (const k of ['GC', 'TEAM', 'YOU']) for (const x of (r.cls_[k] || [])) if (x.t) local.set(MC.teamKey(x.t), x.t);
        const localTeam = n => {
          const k = MC.teamKey(n || '').replace('bahrein', 'bahrain'); if (!k || local.has(k)) return local.get(k) || n;
          const c = [...local.keys()].filter(lk => k.length >= 3 && (lk.startsWith(k) || lk.includes(k) || (lk.length >= 5 && k.includes(lk))));
          return c.length === 1 ? local.get(c[0]) : n;
        };
        if (r.cls_.TOT) r.cls_.TOT = r.cls_.TOT.map(x => ({ ...x, t: localTeam(x.t) }));
        for (const k of SEC_ORDER) if (r.cls_[k]) o.cl[k] = r.cls_[k].map(rowOut);
        if (r.leaders && Object.keys(r.leaders).length) { o.ld = {}; for (const [n, name] of Object.entries(r.leaders)) o.ld[n] = rid(name); }
        if (!o.st.length && !Object.keys(o.cl).length) return;
        upsert(data.races, o);
      },
      // Temporada entera desde la web oficial (scripts/official.js): off = {season, events:[{e, n, type, category, rows}], meta}
      // fila oficial = [clasificación, puesto, idCorredor, nombre, idEquipo, equipo, puntos, días, tiempo, perfil]
      addOfficialSeason(off) {
        const season = +off.season;
        offSeasons.add(season); curSeason = season;
        data.races = data.races.filter(r => r.s !== season); // lo del foro de esa temporada no se usa
        // nombre de cada equipo oficial: el de su última prueba (los cambios de nombre siguen siendo un equipo)
        const tName = new Map();
        for (const ev of off.events) for (const x of ev.rows) if (x[4] != null && x[5]) tName.set(x[4], x[5]);
        const tOf = new Map();
        const T = t => { if (t == null) return -1; if (!tOf.has(t)) { const n = tName.get(t), id = tid(n); if (id >= 0 && n) { data.teams[id] = n; teamId.set(MC.teamKey(n), id); } tOf.set(t, id); } return tOf.get(t); };
        const claimed = new Set(ridOfOid.values());
        const R = (oid, name) => {
          if (oid == null || !name) return -1;
          let id = ridOfOid.get(oid);
          if (id == null) {
            const clean = stripTeam(cleanName(name));
            id = rid(name, false);
            if (id >= 0 && claimed.has(id)) id = -1;
            if (id < 0) { const f = fuzzy(clean); if (f >= 0 && !claimed.has(f)) id = f; }
            if (id < 0) { id = data.riders.length; data.riders.push([MC.norm(clean.replace(/\(J\)/gi, ''))]); votes.push({}); if (!riderId.has(MC.riderKey(clean))) riderId.set(MC.riderKey(clean), id); if (!tokId.has(MC.tokenKey(clean))) tokId.set(MC.tokenKey(clean), id); }
            ridOfOid.set(oid, id); oidOf.set(id, oid); claimed.add(id);
            const on = MC.norm(clean.replace(/\(J\)/gi, '')); votes[id][on] = (votes[id][on] || 0) + 1e4; // el nombre de la web oficial manda
          }
          touch(id, stripTeam(cleanName(name)));
          return id;
        };
        const ISO = { it: 'ITA', fr: 'FRA', be: 'BEL', es: 'ESP', nl: 'NED', pt: 'POR', cn: 'CHN', pl: 'POL', de: 'GER', ch: 'SWI', gr: 'GRE', tr: 'TUR', au: 'AUS', dk: 'DEN', cz: 'CZE', nz: 'NZL', cl: 'CHI', ie: 'IRL', by: 'BLR', hr: 'CRO', uz: 'UZB', at: 'AUT', lu: 'LUX', no: 'NOR', si: 'SLO', us: 'USA', ca: 'CAN', co: 'COL', ae: 'UAE', rw: 'RWA', tw: 'TWN', th: 'THA', hu: 'HUN', ir: 'IRN', ee: 'EST', mu: 'MUS', ro: 'ROM', kr: 'KOR', gb: 'GBR', sk: 'SVK', my: 'MAS', jp: 'JPN', ar: 'ARG', br: 'BRA', mx: 'MEX', ec: 'ECU', ve: 'VEN', za: 'RSA', ma: 'MAR', dz: 'ALG', eg: 'EGY', er: 'ERI', et: 'ETH', kz: 'KAZ', ru: 'RUS', ua: 'UKR', se: 'SWE', fi: 'FIN', lv: 'LAT', lt: 'LTU', rs: 'SRB', ba: 'BIH', me: 'MNE', mk: 'MKD', al: 'ALB', bg: 'BUL', md: 'MDA', ge: 'GEO', am: 'ARM', az: 'AZE', il: 'ISR', sa: 'SAU', om: 'OMA', qa: 'QAT', bh: 'BRN', kw: 'KUW', jo: 'JOR', in: 'IND', id: 'INA', ph: 'PHI', vn: 'VIE', sg: 'SGP', hk: 'HKG', mn: 'MGL', cr: 'CRC', gt: 'GUA', pa: 'PAN', pr: 'PUR', do: 'DOM', cu: 'CUB', jm: 'JAM', uy: 'URU', py: 'PAR', bo: 'BOL', pe: 'PER', cm: 'CMR', bj: 'BEN', ci: 'CIV', gh: 'GHA', ke: 'KEN', ug: 'UGA', tn: 'TUN', sm: 'SMR', ad: 'AND', mc: 'MON', li: 'LIE', mt: 'MLT', cy: 'CYP', is: 'ISL' };
        const SEC = { 'General': 'GC', 'Regularidad': 'PTS', 'Montaña': 'KOM', 'Jóvenes': 'YOU', 'Equipos': 'TEAM' };
        const addDays = (n, d) => n + d;
        const fw = n => MC.riderKey(n).split(' ')[0];
        let lastDate = null;
        for (const ev of off.events) {
          const m = (off.meta || {})[ev.e] || [];
          const start = m[0] || lastDate; if (m[0]) lastDate = m[0];
          const fl = String(m[2] || '').toLowerCase();
          const ins = data.ins.find(i => i.s === season && i.start === start && fw(i.name) === fw(ev.n)) || data.ins.find(i => i.s === season && i.start === start && MC.riderKey(i.name).includes(MC.riderKey(ev.n).split(' ').slice(0, 2).join(' ')));
          const multi = ev.rows.some(x => /^Etapa\s/.test(x[0]) || x[0] === 'General');
          const o = { id: 900000 + ev.e, o: ev.e, s: season, name: ev.n, start, end: null, c: ISO[fl] || ISO[fl.split('-')[0]] || (/^[A-Z]{3}$/.test(m[3] || '') ? m[3] : (ins && ins.c) || undefined), cls: m[1] || (ins && ins.cls) || undefined, multi: multi ? 1 : 0, rp: ev.rows.length, st: [], cl: {}, dy: {} };
          const stages = new Map(), ld = {};
          for (const x of ev.rows) {
            const [c, p, oid, name, t, , pts, days, time, prof] = x;
            const r = oid != null ? R(oid, name) : -1, tt = T(t);
            if (r >= 0 && days) o.dy[r] = (o.dy[r] || 0) + days;
            const num = typeof p === 'number' ? p : /^\d+$/.test(String(p)) ? +p : null;
            if (/^(Clásica|Etapa\s*\d+)/.test(c)) {
              const n = c === 'Clásica' ? 0 : +c.match(/\d+/)[0];
              if (/^l[ií]der$/i.test(String(p))) { if (r >= 0) { ld[n] = r; (o.cl.LDR = o.cl.LDR || []).push([n, r, tt, '', pts]); } continue; }
              if (num == null) continue; // abandonos: cuentan los días, no salen en la clasificación
              if (!stages.has(n)) stages.set(n, { n, l: c === 'Clásica' ? 'Resultado' : 'Etapa ' + n, ty: prof || undefined, rows: [] });
              const s = stages.get(n); if (!s.ty && prof) s.ty = prof;
              s.rows.push([num, r, tt, time || '', pts]);
            } else if (SEC[c]) {
              if (num == null) continue;
              (o.cl[SEC[c]] = o.cl[SEC[c]] || []).push([num, SEC[c] === 'TEAM' ? -1 : r, tt, time || '', pts]);
            }
          }
          o.st = [...stages.values()].sort((a, b) => a.n - b.n);
          if (Object.keys(ld).length) o.ld = ld;
          if (!Object.keys(o.dy).length) delete o.dy;
          if (multi && start) {
            if (ins && ins.end && ins.end >= start) o.end = ins.end;
            else { const N = o.st.length || 1; const d = new Date(start + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + addDays(N - 1, N >= 21 ? 2 : 0)); o.end = d.toISOString().slice(0, 10); }
          }
          if (ins && ins.im) o.im = ins.im;
          if (!o.st.length && !Object.keys(o.cl).length) continue;
          data.races.push(o);
        }
        data.offSeasons = [...offSeasons].sort();
      },
      addIns(i, replies) {
        curSeason = seasonOf(i);
        const o = { id: i.id, s: seasonOf(i), name: i.name, start: i.start, end: i.end, c: i.country, cls: i.cls, note: i.note || undefined, im: i.im || undefined, sc: i.sc || undefined, scr: i.scRest || undefined, closed: i.closed ? 1 : 0, rp: replies, min: i.minR, max: i.maxR,
          e: i.entries.map(e => ({ m: e.manager, t: e.team, d: e.date, r: e.riders.map(x => {
            if (teamId.has(MC.teamKey(x.name)) || isJunk(stripTeam(cleanName(x.name)))) return -1;
            let id = rid(x.name, false);
            if (id < 0) { const cn = stripTeam(cleanName(x.name)); id = fuzzy(cn); if (id >= 0) touch(id, cn); else id = rid(x.name); }
            if (x.young) markYoung(id);
            return id;
          }).filter(id => id >= 0) })).filter(e => e.r.length) };
        if (i.img && i.img.length) o.img = i.img;
        upsert(data.ins, o);
      },
      finish(meta) {
        mergeDuplicates();
        // las reglas para completar lo que el foro no publica no tocan lo que viene de la web oficial
        const all = data.races; data.races = all.filter(r => !r.o);
        try { mergeTeamRenames(); fillScales(); } finally { data.races = all; }
        data.riders.forEach((r, i) => {
          const v = Object.entries(votes[i] || {}).map(([n, c]) => [n, c * capsPenalty(n)]).sort((a, b) => b[1] - a[1] || b[0].length - a[0].length);
          if (v.length) r[0] = v[0][0];
          r[0] = fixCaps(r[0]);
          const ys = r.slice(1).filter(y => typeof y === 'number' && y > 1900).sort();
          r.length = 1; r.push(...ys);
        });
        data.races.sort((a, b) => (a.start || '').localeCompare(b.start || '') || a.id - b.id);
        data.ins.sort((a, b) => (a.start || '').localeCompare(b.start || '') || a.id - b.id);
        data.seasons = [...new Set(data.races.map(r => r.s).concat(data.ins.map(i => i.s)).filter(Boolean))].sort();
        if (oidOf.size) data.oid = Object.fromEntries([...oidOf].sort((a, b) => a[0] - b[0]));
        if (offSeasons.size) data.offSeasons = [...offSeasons].sort();
        if (meta) Object.assign(data, meta);
        return data;
      }
    };
  }

  // Parse raw topics ({id, t:{title,replies,closed,kind}, posts:[{a,tm,d,L}]}) into the compactor.
  function ingest(comp, topics, opts = {}) {
    const res = topics.filter(x => x.t.kind === 'res');
    const ins = topics.filter(x => x.t.kind === 'ins');
    const teamIdx = MC.TeamIndex();
    comp.data.teams.forEach(t => teamIdx.add(t));
    MC.learnTeams(res, teamIdx);
    for (const x of res) { try { comp.addRace(MC.parseRaceTopic(x, teamIdx), x.t.replies); } catch (e) { opts.onError && opts.onError(x, e); } }
    for (const x of ins) { try { const i = MC.parseInscriptionTopic(x); if (i.start) comp.addIns(i, x.t.replies); } catch (e) { opts.onError && opts.onError(x, e); } }
  }

  // Puntos y días por corredor y puntos por equipo de una temporada, con las mismas reglas que la web (app.js)
  function seasonTotals(data, season, today) {
    today = today || new Date().toISOString().slice(0, 10);
    const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
    const R = new Map(), T = new Map();
    const RS = id => { let o = R.get(id); if (!o) { o = { pts: 0, days: 0 }; R.set(id, o); } return o; };
    for (const r of data.races) {
      if (+r.s !== +season) continue;
      const add = row => { const [p, rid, tid, v, pts] = row; if (tid >= 0 && pts) T.set(tid, (T.get(tid) || 0) + pts); if (rid >= 0) RS(rid).pts += pts || 0; };
      r.st.forEach(s => s.rows.forEach(add));
      for (const k of ['GC', 'PTS', 'KOM', 'YOU', 'LDR']) (r.cl[k] || []).forEach(add);
      (r.cl.TEAM || []).forEach(([p, rid, tid, v, pts]) => { if (tid >= 0 && pts) T.set(tid, (T.get(tid) || 0) + pts); });
      const dayRows = new Map();
      if (r.dy) { for (const [k, d] of Object.entries(r.dy)) dayRows.set(+k, d); } // días tal y como los da la web oficial
      else if (/^(WC|OG)\./.test(r.cls || '')) { /* no cuentan */ }
      else if (!r.multi) {
        r.st.forEach(s => s.rows.forEach(w => { if (w[1] >= 0) dayRows.set(w[1], 1); }));
        for (const k of ['GC', 'PTS', 'KOM', 'YOU', 'LDR']) (r.cl[k] || []).forEach(w => { if (w[1] >= 0) dayRows.set(w[1], 1); });
      } else {
        const prl = new Set(r.st.filter(s => s.ty === 'PRL').map(s => Math.floor(s.n)));
        const dayN = [...new Set(r.st.map(s => Math.floor(s.n)))].sort((a, b) => (prl.has(b) - prl.has(a)) || a - b);
        const span = r.end && r.start ? daysBetween(r.start, r.end) + 1 : dayN.length;
        const D = Math.min(dayN.length, span);
        const ended = !(r.end && r.end >= today);
        r.st.forEach(s => { const di = dayN.indexOf(Math.floor(s.n)); s.rows.forEach(w => { if (w[1] >= 0) dayRows.set(w[1], Math.max(dayRows.get(w[1]) || 0, di + 1)); }); });
        const gc = new Set((r.cl.GC || []).map(w => w[1]));
        for (const [rid, d] of dayRows) dayRows.set(rid, gc.has(rid) ? D : Math.min(D, ended ? d + 1 : d));
        for (const rid of gc) if (rid >= 0 && !dayRows.has(rid)) dayRows.set(rid, D);
      }
      for (const [rid, d] of dayRows) RS(rid).days += d;
    }
    return { riders: R, teams: T };
  }

  G.MCBuild = { Compactor, ingest, seasonTotals };

// Fetching + DOM reading of the Managercycling forum (foroactivo). Works in browsers
// (forum sends Access-Control-Allow-Origin: *) and in node with a DOMParser polyfill.
(function (G) {
  const BASE = 'https://managercycling.foroactivo.com';
  const POSTS_PER_PAGE = 25, TOPICS_PER_PAGE = 50;
  const norm = s => (s || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const num = s => { const t = String(s || '').replace(/[^\d]/g, ''); return t ? parseInt(t, 10) : 0; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));


  // ---- DOM-free readers (node / GitHub Actions) ----
  const ENT = { nbsp: ' ', amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", laquo: '«', raquo: '»', ndash: '–', mdash: '—', hellip: '…', iexcl: '¡', iquest: '¿', ordm: 'º', ordf: 'ª', deg: '°', middot: '·', rsquo: '’', lsquo: '‘', rdquo: '”', ldquo: '“', bull: '•', euro: '€', copy: '©', reg: '®' };
  const decode = s => s.replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, (m, e) => e[0] === '#' ? String.fromCodePoint(e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : +e.slice(1)) : (ENT[e.toLowerCase()] ?? m));
  const strip = h => decode(h.replace(/<[^>]*>/g, ''));
  function htmlLines(h) {
    h = h.replace(/<(style|script|noscript|iframe)\b[\s\S]*?<\/\1>/gi, '').replace(/<ins\b[\s\S]*?<\/ins>/gi, '').replace(/\r?\n/g, ' ');
    h = h.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|tr|li|h[1-4])>/gi, '\n').replace(/<\/t[dh]>/gi, '\t');
    return strip(h).replace(/ /g, ' ').split('\n').map(l => l.replace(/^[ \t]+|[ \t]+$/g, '')).filter(Boolean);
  }
  function listTopicsText(html) {
    const out = [];
    const rows = html.split(/<tr\b/i);
    for (const r of rows) {
      const a = r.match(/<a class="topictitle" href="\/?(t(\d+)-[^"]*)"[^>]*>([\s\S]*?)<\/a>/i);
      if (!a) continue;
      const tds = r.split(/<td\b/i).slice(1);
      const icon = (tds[0] || '').match(/src="([^"]*)"/i);
      out.push({ id: +a[2], slug: a[1], title: norm(strip(a[3])), replies: tds[3] ? num(strip('<td' + tds[3])) : 0, closed: !!(icon && /lock/.test(icon[1])) });
    }
    return out;
  }
  // pictures in a post (race profiles, maps…), without smileys, icons or avatars
  const isPicture = src => /^https?:\/\//i.test(src) && !/smil|emoji|icon|avatar|rank|\/images\/|button|forumactif\.com\/i\/|illiweb|\.svg(\?|$)/i.test(src);
  function imagesText(html) {
    const out = [];
    for (const m of html.matchAll(/<img\b[^>]*?\bsrc="([^"]+)"/gi)) { const src = decode(m[1]); if (isPicture(src) && !out.includes(src)) out.push(src); }
    return out.slice(0, 6);
  }
  function pageCountText(html) { let max = 1; for (const m of html.matchAll(/href="\/?f\d+p(\d+)-/g)) max = Math.max(max, Math.floor(+m[1] / TOPICS_PER_PAGE) + 1); return max; }
  function readPostsText(html) {
    const parts = html.split(/<tr class="post\b/i).slice(1);
    const out = [];
    for (const p of parts) {
      const idm = p.match(/^[^>]*\bid="p(\d+)"/);
      const nameM = p.match(/<span class="name">([\s\S]*?)<\/span>\s*(?:<\/strong>\s*)*<\/span>|<span class="name">([\s\S]*?)<br/i);
      const author = norm(strip((nameM && (nameM[1] || nameM[2])) || '').replace(/<a[^>]*><\/a>/g, ''));
      const profM = p.match(/<span class="postdetails poster-profile">([^<]*)/i);
      const prof = norm(decode(profM ? profM[1] : ''));
      const team = (prof.match(/^M[áa]nager del?\s+(.+)$/i) || [])[1] || null;
      const dM = p.match(/<td><span class="postdetails">([\s\S]*?)<\/span><\/td>/i);
      const date = norm(strip(dM ? dM[1] : '')).replace(/^.*?(?=(Lun|Mar|Mi[ée]r?|Jue|Vie|S[áa]b|Dom|Hoy|Ayer)\b)/, '');
      const bi = p.indexOf('<div class="postbody">');
      if (bi < 0) continue;
      let body = p.slice(bi + 22);
      const sig = body.search(/<div class="signature_div"/i);
      const end = body.search(/<\/td>\s*<\/tr>\s*<\/tbody>\s*<\/table>/i);
      body = body.slice(0, sig >= 0 ? sig : (end >= 0 ? end : body.length));
      out.push({ a: author, tm: team, d: date, id: idm ? +idm[1] : null, L: htmlLines(body), im: imagesText(body) });
    }

  }

  const SECTION_NAMES = { 455: 'resultados', 451: 'inscripciones' };
  function Forum(opts = {}) {
    const DP = opts.DOMParser || G.DOMParser;
    const fetchFn = opts.fetch || G.fetch.bind(G);
    const gap = opts.gap ?? 600;           // ms between requests (forum rate-limits with 429)
    const tries = opts.tries ?? 5;

    async function getDoc(path) {
      const url = path.startsWith('http') ? path : BASE + (path.startsWith('/') ? '' : '/') + path;
      for (let attempt = 0; attempt < tries; attempt++) {
        if (stopped) throw new Error('stopped');
        const wait = last + gap - Date.now(); if (wait > 0) await sleep(wait);
        last = Date.now();
        let r;
        try {
          const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          const to = ctl && setTimeout(() => ctl.abort(), 20000);

      }
      throw new Error('gave up ' + url);
    }

    function listTopics(doc) {
      if (typeof doc === 'string') return listTopicsText(doc);
      const out = [];
      doc.querySelectorAll('a.topictitle').forEach(a => {
        const href = a.getAttribute('href') || '';
        const m = href.match(/\/?t(\d+)-/);
        if (!m) return;
        let tr = a.parentElement; while (tr && tr.tagName !== 'TR') tr = tr.parentElement;
        const tds = tr ? [...tr.children] : [];
        const icon = (tds[0] && tds[0].querySelector('img') && tds[0].querySelector('img').getAttribute('src')) || '';
        out.push({ id: +m[1], slug: href.replace(/^\//, ''), title: norm(a.textContent), replies: tds[3] ? num(tds[3].textContent) : 0, closed: /lock/.test(icon) });
      });
      return out;
    }
    function pageCount(doc) {
      if (typeof doc === 'string') return pageCountText(doc);
      let max = 1;
      doc.querySelectorAll('a[href]').forEach(a => { const m = (a.getAttribute('href') || '').match(/^\/?f\d+p(\d+)-/); if (m) max = Math.max(max, Math.floor(+m[1] / TOPICS_PER_PAGE) + 1); });
      return max;
    }
    // Pages of a forum section; stopAt(topicsOnPage) → true to stop early
    async function forumTopics(fid, { maxPages = 50, stopAt } = {}) {
      // Full section address ("455-resultados"): the short form "/f455-" is a redirect
      // without CORS headers, so browsers on other sites cannot read it.
      const fm = String(fid).match(/^f?(\d+)(?:-(.*))?$/);
      const id = fm ? fm[1] : fid, name = (fm && fm[2]) || SECTION_NAMES[id] || '';
      const first = await getDoc(`/f${id}-${name}`);
      const pages = Math.min(pageCount(first), maxPages);
      let all = listTopics(first);
      if (stopAt && stopAt(all)) return all;
      for (let p = 1; p < pages; p++) {
        const ts = listTopics(await getDoc(`/f${id}p${p * TOPICS_PER_PAGE}-${name}`));
        all = all.concat(ts);
        if (stopAt && stopAt(ts)) break;
      }
      const seen = new Set();
      return all.filter(t => !seen.has(t.id) && seen.add(t.id));
    }

    function bodyLines(postbody) {
      const c = postbody.cloneNode(true);
      c.querySelectorAll('.signature_div, style, script, iframe, ins, noscript, .clear').forEach(e => e.remove());
      c.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
      c.querySelectorAll('div, p, tr, li, h1, h2, h3, h4').forEach(b => b.append('\n'));
      c.querySelectorAll('td, th').forEach(b => b.append('\t'));
      return c.textContent.replace(/ /g, ' ').split('\n').map(l => l.replace(/^[ \t]+|[ \t]+$/g, '')).filter(Boolean);
    }
    function readPosts(doc) {
      if (typeof doc === 'string') return readPostsText(doc);
      return [...doc.querySelectorAll('tr.post')].map(tr => {
        const left = tr.children[0], right = tr.children[1];
        const body = right && right.querySelector('.postbody');
        if (!body) return null;
        const author = norm((left.querySelector('.name') || {}).textContent || '');
        const profEl = left.querySelector('.poster-profile');
        const prof = norm(profEl && profEl.childNodes[0] ? profEl.childNodes[0].textContent : '');
        const team = (prof.match(/^M[áa]nager del?\s+(.+)$/i) || [])[1] || null;
        const date = norm((right.querySelector('.postdetails') || {}).textContent || '').replace(/^.*?(?=(Lun|Mar|Mi[ée]r?|Jue|Vie|S[áa]b|Dom|Hoy|Ayer)\b)/, '');
        const im = [...new Set([...body.querySelectorAll('img')].map(i => i.getAttribute('src') || '').filter(isPicture))].slice(0, 6);
        return { a: author, tm: team, d: date, id: +(tr.id || '').replace(/\D/g, '') || null, L: bodyLines(body), im };
      }).filter(Boolean);
    }
    async function topic(t, kind) {
      const pages = Math.ceil(((t.replies || 0) + 1) / POSTS_PER_PAGE) || 1;
      let posts = [];
      for (let p = 0; p < pages; p++) {
        const slug = p === 0 ? t.slug : t.slug.replace(/^t(\d+)-/, `t$1p${p * POSTS_PER_PAGE}-`);
        posts = posts.concat(readPosts(await getDoc('/' + slug)));
      }
      // pictures: race profile in the first post; in results also each stage post's profile
      posts.forEach((p, i) => { if ((i > 0 && kind !== 'res') || !p.im || !p.im.length) delete p.im; else p.im = p.im.slice(0, 3); });
      return { id: t.id, t: { ...t, kind }, posts, iv: 1 };
    }
    // first post's pictures only (one request)
    async function firstImages(t) {
      const posts = readPosts(await getDoc('/' + t.slug));
      return (posts[0] && posts[0].im) || [];
    }
    return { getDoc, forumTopics, topic, firstImages, readPosts, listTopics, stop() { stopped = true; } };
  }

  G.MCForum = { Forum, BASE, readPostsText, listTopicsText };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ManagerCycling Stats — UI */
(function () {
  'use strict';
  const MC = window.MC;
  const CONFIG = window.MCS_CONFIG || {};
  const FORUM = 'https://managercycling.foroactivo.com';
  const OFFWEB = 'https://managercycling-web.vercel.app';
  const CUR_FORUMS = CONFIG.currentForums || { res: '455-resultados', ins: '451-inscripciones' };
  const MAX_DAYS = CONFIG.maxDays || 85; // máximo de días de competición por corredor y temporada

  // ---------- helpers ----------
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const MESL = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const pad = n => String(n).padStart(2, '0');
  const now = new Date();
  const TODAY = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const CLS_NAME = { GC: 'General', PTS: 'Regularidad', KOM: 'Montaña', YOU: 'Jóvenes', TEAM: 'Equipos', TOT: 'Puntos MC por equipos' };
  const CLS_SHORT = { GC: 'General', PTS: 'Puntos', KOM: 'Montaña', YOU: 'Jóvenes', TEAM: 'Equipos', TOT: 'Pts MC equipos' };
  const fmtN = n => n == null ? '' : (Math.round(n * 100) / 100).toLocaleString('es-ES', { maximumFractionDigits: 2 });
  const dshort = d => d ? `${+d.slice(8, 10)} ${MES[+d.slice(5, 7) - 1]}` : '';
  const drange = (a, b) => !a ? '' : (!b || a === b ? dshort(a) : (a.slice(5, 7) === b.slice(5, 7) ? `${+a.slice(8, 10)}–${+b.slice(8, 10)} ${MES[+b.slice(5, 7) - 1]}` : `${dshort(a)} – ${dshort(b)}`));
  const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
  const slugify = s => MC.fold(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const ordinal = p => p == null ? '' : p + 'º';
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); } catch (e) { } } };

  let D = null, IX = null;
  const state = { season: null, live: 'idle', liveMsg: '' };

  // ---------- data loading ----------
  async function getJSON(u) { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); }

  async function loadData() {
    const core = await getJSON('data/core.json');
    const fresh = { ...core, races: [], ins: [] };
    D = fresh;
    const seasons = core.seasons.slice().sort((a, b) => b - a);
    const first = seasons[0];
    const s1 = await getJSON(`data/s${first}.json`);
    D.official = {};
    D.races.push(...s1.races); D.ins.push(...s1.ins); if (s1.official) D.official[first] = s1.official;
    applyCachedLive();
    rebuild();
    // remaining seasons in the background
    const rest = seasons.slice(1);
    if (rest.length) {
      Promise.all(rest.map(y => getJSON(`data/s${y}.json`).catch(() => null))).then(list => {
        list.forEach((x, i) => { if (x) { D.races.push(...x.races); D.ins.push(...x.ins); if (x.official) D.official[rest[i]] = x.official; } });
        D.races.sort((a, b) => (a.start || '').localeCompare(b.start || ''));
        D.ins.sort((a, b) => (a.start || '').localeCompare(b.start || ''));
        D.allLoaded = true;
        rebuild(); route();
      });
    } else D.allLoaded = true;
  }

  // ---------- indexes ----------
  function eventKey(s, name, start) { return s + '|' + start + '|' + MC.riderKey(name).split(' ').slice(0, 3).join(' '); }

  function rebuild() {
    const ix = {
      raceById: new Map(), insById: new Map(), events: [], evById: new Map(),
      riderRes: D.riders.map(() => []), riderSlug: [], slugRider: new Map(), teamSlug: [], slugTeam: new Map(),
      season: new Map(), riderTeam: new Map(), next: new Map(), riderSeasons: D.riders.map(() => new Set())
    };
    // slugs
    D.riders.forEach((r, i) => { let s = slugify(r[0]) || 'r' + i; if (ix.slugRider.has(s)) s += '-' + i; ix.riderSlug[i] = s; ix.slugRider.set(s, i); });
    D.teams.forEach((t, i) => { let s = slugify(t) || 't' + i; if (ix.slugTeam.has(s)) s += '-' + i; ix.teamSlug[i] = s; ix.slugTeam.set(s, i); });
    // events (race results + inscriptions)
    const byKey = new Map();
    const evFor = (o, kind) => {
      let k = eventKey(o.s, o.name, o.start);
      let ev = byKey.get(k);
      if (ev && ev[kind]) ev = null; // dos temas distintos con la misma clave: no mezclarlos
      if (!ev) {
        // fallback: same start date and same first word
        const fw = MC.riderKey(o.name).split(' ')[0];
        ev = ix.events.find(e => e.start === o.start && !e[kind] && MC.riderKey(e.name).split(' ')[0] === fw);
      }
      if (!ev) { ev = { key: k, s: o.s, name: o.name, start: o.start, end: o.end, c: o.c, cls: o.cls, note: o.note }; ix.events.push(ev); }
      if (!byKey.has(k) || !byKey.get(k)[kind]) byKey.set(k, ev);
      ev[kind] = o;
      if (kind === 'race') { ev.name = o.name; ev.end = ev.end || o.end; }
      return ev;
    };
    D.races.forEach(r => { ix.raceById.set(r.id, r); evFor(r, 'race'); });
    D.ins.forEach(i => { ix.insById.set(i.id, i); evFor(i, 'ins'); });
    ix.events.forEach(ev => { ev.id = ev.race ? 'r' + ev.race.id : 'i' + ev.ins.id; ix.evById.set(ev.id, ev); if (ev.race) ix.evById.set('i' + (ev.ins ? ev.ins.id : ''), ev); if (ev.ins) ix.evById.set('i' + ev.ins.id, ev); });
    ix.events.sort((a, b) => (a.start || '').localeCompare(b.start || '') || a.name.localeCompare(b.name));

    const S = y => { if (!ix.season.has(y)) ix.season.set(y, { riders: new Map(), teams: new Map(), managers: new Map(), teamMgr: new Map() }); return ix.season.get(y); };
    const RS = (st, rid) => { let o = st.riders.get(rid); if (!o) { o = { pts: 0, wins: 0, gc: 0, pod: 0, top10: 0, days: 0, races: 0, lead: 0, best: [], last: null, lastT: -1 }; st.riders.set(rid, o); } return o; };
    const TS = (st, tid) => { let o = st.teams.get(tid); if (!o) { o = { pts: 0, rpts: 0, tot: 0, wins: 0, riders: new Set(), winsList: [] }; st.teams.set(tid, o); } return o; };

    for (const r of D.races) {
      const st = S(r.s), seen = new Set();
      const add = (row, k, si) => {
        const [p, rid, tid, v, pts] = row;
        if (tid >= 0 && pts && k !== 'TOT') TS(st, tid).pts += pts; // puntos de equipo = suma de puntos de sus corredores + clasificación por equipos
        if (rid < 0) return;
        ix.riderRes[rid].push({ r, k, si, p, pts, v, t: tid });
        ix.riderSeasons[rid].add(r.s);
        const o = RS(st, rid);
        o.pts += pts || 0;
        if (k === 'st') { if (p === 1) { o.wins++; o.best.push({ r, si }); } if (p <= 3) o.pod++; if (p <= 10) o.top10++; }
        if (k === 'GC' && r.multi) { if (p === 1) { o.gc++; o.wins++; } if (p <= 3) o.pod++; if (p <= 10) o.top10++; }
        if (!seen.has(rid)) { seen.add(rid); o.races++; }
        if (tid >= 0 && !seen.has('t' + rid)) { seen.add('t' + rid); o.tv = o.tv || new Map(); o.tv.set(tid, (o.tv.get(tid) || 0) + 1); }
        if (tid >= 0) { const t = TS(st, tid); t.riders.add(rid); t.rpts += pts || 0; if (p === 1 && (k === 'st' || (k === 'GC' && r.multi))) { t.wins++; t.winsList.push({ r, k, si, rid }); } }
      };
      r.st.forEach((s, si) => s.rows.forEach(row => add(row, 'st', si)));
      for (const k of ['GC', 'PTS', 'KOM', 'YOU', 'LDR']) (r.cl[k] || []).forEach(row => add(row, k));
      (r.cl.TEAM || []).forEach(([p, rid, tid, v, pts]) => { if (tid >= 0 && pts) TS(st, tid).pts += pts; });
      (r.cl.TOT || []).forEach(([p, , tid, v, pts]) => { if (tid >= 0) TS(st, tid).tot += pts || 0; });
      if (r.ld) Object.values(r.ld).forEach(rid => { if (rid >= 0) RS(st, rid).lead++; });
      // días de competición: una clásica = 1 día; en vueltas, hasta la etapa en que abandona (incluida);
      // los dobles sectores del mismo día cuentan como uno
      const dayRows = new Map();
      if (r.dy) { for (const [k, d] of Object.entries(r.dy)) dayRows.set(+k, d); } // web oficial: días tal y como cuentan allí
      else if (/^(WC|OG)\./.test(r.cls || '')) { /* Mundiales y JJOO no cuentan para el límite de días */ }
      else if (!r.multi) {
        r.st.forEach(s => s.rows.forEach(w => { if (w[1] >= 0) dayRows.set(w[1], 1); }));
        for (const k of ['GC', 'PTS', 'KOM', 'YOU', 'LDR']) (r.cl[k] || []).forEach(w => { if (w[1] >= 0) dayRows.set(w[1], 1); });
      } else {
        // un prólogo cuenta como el primer día aunque en el foro se numere como la última etapa
        const prl = new Set(r.st.filter(s => s.ty === 'PRL').map(s => Math.floor(s.n)));
        const dayN = [...new Set(r.st.map(s => Math.floor(s.n)))].sort((a, b) => (prl.has(b) - prl.has(a)) || a - b);
        const span = r.end && r.start ? daysBetween(r.start, r.end) + 1 : dayN.length;
        const D = Math.min(dayN.length, span);
        const ended = !(r.end && r.end >= TODAY);

        const gc = new Set((r.cl.GC || []).map(w => w[1]));

      }

    }
    for (const [y, a] of Object.entries(D.official || {})) S(+y).official = a;
    // rider's team per season (team he raced most races with)
    for (const [, st] of ix.season) for (const [, o] of st.riders) { let b = -1, bv = 0; if (o.tv) for (const [t, v] of o.tv) if (v > bv) { bv = v; b = t; } o.lastT = b; }
    for (const [y, st] of ix.season) for (const [rid, o] of st.riders) { if (!ix.riderTeam.has(rid)) ix.riderTeam.set(rid, new Map()); ix.riderTeam.get(rid).set(y, o.lastT); }
    // managers ↔ teams from inscriptions

        for (const rid of e.r) { const t = ix.riderTeam.get(rid)?.get(i.s); if (t != null && t >= 0) votes.set(t, (votes.get(t) || 0) + 1); }
        let best = -1, bv = 0; for (const [t, v] of votes) if (v > bv) { bv = v; best = t; }
        e.tid = bv >= Math.max(2, e.r.length / 2) ? best : -1;
        if (e.m && e.tid >= 0) {
          const mm = st.managers.get(e.m) || new Map(); mm.set(e.tid, (mm.get(e.tid) || 0) + 1); st.managers.set(e.m, mm);
        }

    ix.seasons = [...ix.season.keys()].sort((a, b) => b - a);
    IX = ix;
    const saved = +(ls.get('mcs.season'));
    if (!state.season || !IX.season.has(state.season) || (!state.userSeason && saved && saved !== state.season && IX.season.has(saved))) state.season = saved && IX.season.has(saved) ? saved : ix.seasons[0];

  }

  // ---------- small render helpers ----------
  // (J) marks are per season: riders[i] = [name, ...seasons]
  const young = (rid, y = state.rs) => { const r = D.riders[rid]; return !!r && r.length > 1 && (y == null ? true : r.includes(y, 1)); };

  // categoría del equipo (WT o CP) en las temporadas que vienen de la web oficial
  const divOf = name => { if (!D.div || !(D.offSeasons || []).includes(state.season)) return ''; const d = D.div[name]; if (d) return d; const k = MC.teamKey(name || ''); for (const n in D.div) if (MC.teamKey(n) === k) return D.div[n]; return ''; };
  const divBadge = name => { const d = divOf(name); return d ? `<span class="dv dv-${d.toLowerCase()}" title="${d === 'WT' ? 'WorldTour' : 'Continental Profesional'}">${esc(d)}</span>` : ''; };

  const attrsOf = (oid, y) => D.attrs && D.attrs.seasons[y] ? D.attrs.seasons[y][oid] : null;

  function typeIcon(ty) {
