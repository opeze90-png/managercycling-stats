    if (r) {
      r.st.forEach((s, si) => tabs.push({ id: 's' + si, label: r.multi ? s.l : 'Resultado', ty: s.ty }));
      for (const k of ['GC', 'PTS', 'KOM', 'YOU', 'TEAM', 'TOT']) if (r.cl[k] && r.cl[k].length && (r.multi || ['YOU', 'TEAM', 'TOT', 'KOM', 'PTS'].includes(k))) tabs.push({ id: k, label: CLS_SHORT[k], cls: k });
    }
    if (ev.ins) tabs.push({ id: 'sl', label: 'Inscritos' });
    if (!tabs.length) return notFound('Esta carrera aún no tiene datos.');
    let cur = state.raceTab && tabs.find(t => t.id === state.raceTab) ? state.raceTab : null;
    if (!cur) cur = r ? (r.multi ? (status(ev).k === 'done' && r.cl.GC ? 'GC' : 's' + (r.st.length - 1)) : 's0') : 'sl';
    if (!r && ev.ins) cur = 'sl';
    const tab = tabs.find(t => t.id === cur);

    let content = '', side = '';
    if (cur === 'sl') content = startlist(ev, state.hl);
    else if (cur[0] === 's') {
      const s = r.st[+cur.slice(1)];
      const lead = r.ld ? r.ld[s.n] : null;
      content = `${r.multi ? `<div class="stage-h">${typeIcon(s.ty)}<div><h3 class="h3">${esc(s.l)}${s.ty ? ` <span class="muted">· ${esc(TYPE_LABEL[s.ty.split(' ')[0]] || s.ty)}${/PAV/.test(s.ty) ? ' con pavés' : ''}</span>` : ''}</h3>${s.ro ? `<p class="muted small">${esc(s.ro)}</p>` : ''}</div>${lead != null && lead >= 0 ? `<div class="stage-lead">${jersey('GC')}<span class="muted small">Líder tras la etapa</span> ${rlink(lead)}</div>` : ''}</div>` : (s.ty ? `<div class="stage-h">${typeIcon(s.ty)}<span class="muted">${esc(TYPE_LABEL[s.ty.split(' ')[0]] || s.ty)}</span></div>` : '')}
        ${resultTable(s.rows, { hl: state.hl, leader: lead })}`;
    } else {
      const rows = r.cl[cur];
      content = `<div class="stage-h">${jersey(cur)}<h3 class="h3">${esc(CLS_NAME[cur])}${cur === 'TOT' ? ' <span class="muted small">(suma de puntos de cada equipo en la carrera)</span>' : ''}</h3></div>${resultTable(rows, { team: cur === 'TEAM' || cur === 'TOT', hl: state.hl, vlabel: cur === 'GC' || cur === 'YOU' || cur === 'TEAM' ? 'Tiempo' : 'Valor' })}`;
    }
    if (r) {
      const w = [];
      for (const k of ['GC', 'PTS', 'KOM', 'YOU']) if (r.cl[k] && r.cl[k][0] && (r.multi || k !== 'GC')) w.push(`<li>${jersey(k)}<span class="muted small">${CLS_NAME[k]}</span>${rlink(r.cl[k][0][1])}</li>`);
      if (r.cl.TEAM && r.cl.TEAM[0]) w.push(`<li>${jersey('TEAM')}<span class="muted small">Equipos</span>${tlink(r.cl.TEAM[0][2])}</li>`);
      const stageW = r.multi ? r.st.map((s, si) => s.rows[0] ? `<li><a href="#carrera-${ev.id}" data-tab="s${si}" class="sw-l">${esc(s.l.replace('Etapa ', 'E'))}</a>${typeIcon(s.ty)}${rlink(s.rows[0][1])}</li>` : '').join('') : '';
      const ld = r.ld ? Object.entries(r.ld).sort((a, b) => a[0] - b[0]) : [];
      const leadDays = new Map(); ld.forEach(([, rid]) => leadDays.set(rid, (leadDays.get(rid) || 0) + 1));
      side = `${w.length ? `<section class="card"><h2 class="h2">Maillots</h2><ul class="jw">${w.join('')}</ul></section>` : ''}
        ${stageW ? `<section class="card"><h2 class="h2">Ganadores de etapa</h2><ul class="sw">${stageW}</ul></section>` : ''}
        ${leadDays.size ? `<section class="card"><h2 class="h2">Días de líder</h2><ul class="jw">${[...leadDays.entries()].sort((a, b) => b[1] - a[1]).map(([rid, n]) => `<li>${jersey('GC')}${rlink(rid)}<span class="n strong">${n}</span></li>`).join('')}</ul></section>` : ''}`;
    }
    // palmarés: misma carrera en otras temporadas
    if (r) { const g = history().byKey.get(r.hk || raceKey(r.name, r.cls)); if (g && g.eds.length) side += `<section class="card"><div class="card-h"><h2 class="h2">Palmarés</h2><a class="more" href="#historia-${g.slug}">Historial</a></div><ul class="wl">${g.eds.slice().reverse().map(e => `<li><span class="li-date">${e.s}</span><span>${e.w ? rlink(e.w[1]) : '—'}</span><a class="small" href="#carrera-${e.ev.id}">${e.ev === ev ? 'esta edición' : 'ver'}</a></li>`).join('')}</ul>${g.rec[0] && g.rec[0][1].length > 1 ? `<p class="small"><span class="rec">Récord</span> ${rlink(g.rec[0][0])} · ${g.rec[0][1].length} victorias</p>` : ''}</section>`; }
    // perfil de la carrera: la foto que el organizador pone en el primer mensaje de la inscripción
    const curStage = r && cur[0] === 's' && cur !== 'sl' && r.multi ? r.st[+cur.slice(1)] : null;
    const imgs = curStage && curStage.im ? [curStage.im] : [...new Set([...((ev.ins && ev.ins.img) || []), ...(ev.ins && ev.ins.im ? [ev.ins.im] : []), ...(r && r.im ? [r.im] : [])])].slice(0, 2);
    if (imgs.length) side = `<section class="card perfil"><h2 class="h2">${curStage && curStage.im ? esc('Perfil · ' + curStage.l) : 'Perfil'}</h2>${imgs.map((u, k) => `<a href="${esc(u)}" target="_blank" rel="noopener" title="Abrir la imagen"><img src="${esc(u)}" alt="Perfil de ${esc(ev.name)}${imgs.length > 1 ? ' ' + (k + 1) : ''}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('a').remove()"></a>`).join('')}</section>` + side;
    if (ev.ins && cur !== 'sl') side += `<section class="card"><h2 class="h2">Inscripción</h2><p class="small">${ev.ins.e.length} equipos inscritos. <a href="#carrera-${ev.id}" data-tab="sl">Ver inscritos</a></p></section>`;
    const links = [r ? (r.o ? `<a href="${OFFWEB}/resultados?prueba=${r.o}" target="_blank" rel="noopener">Resultados en la web oficial</a>` : `<a href="${FORUM}/t${r.id}-" target="_blank" rel="noopener">Resultados en el foro</a>`) : '', ev.ins ? `<a href="${FORUM}/t${ev.ins.id}-" target="_blank" rel="noopener">Inscripciones en el foro</a>` : ''].filter(Boolean).join(' · ');
    return `<header class="ph">
        <div class="ph-meta">${clsBadge(ev.cls)}${ctry(ev.c)}<span>${drange(ev.start, ev.end)}${ev.start ? ' ' + ev.start.slice(0, 4) : ''}</span>${statusPill(ev)}${ev.note ? `<span class="muted">${esc(ev.note)}</span>` : ''}</div>
        <h1 class="h1">${esc(ev.name)}</h1>
        <p class="muted small">${links}</p>
      </header>
      <nav class="tabs" role="tablist">${tabs.map(t => `<a href="#carrera-${ev.id}" data-tab="${t.id}" class="tab ${t.id === cur ? 'on' : ''} ${t.cls ? 'tab-cl' : ''}" role="tab">${t.cls ? jersey(t.cls) : ''}${t.ty && r.multi ? typeIcon(t.ty) : ''}${esc(t.label)}</a>`).join('')}</nav>
      <div class="grid g-race"><div class="col">${cur !== 'sl' ? `<div class="filter"><input id="tfilter" type="search" placeholder="Filtrar por corredor o equipo" aria-label="Filtrar la tabla"></div>` : ''}${content}</div><aside class="col">${side}</aside></div>`;
  }

  // ----- rider page -----
  function riderEntries(rid, y) { return IX.riderRes[rid].filter(x => y == null || x.r.s === y); }
  function pageRider(slug) {
    const rid = IX.slugRider.get(slug);
    if (rid == null) return notFound('No encuentro ese corredor.');
    const name = rname(rid);
    setTitle(name); setNav('ranking');
    const seasons = [...IX.riderSeasons[rid]].sort((a, b) => b - a);
    const nextAll = (IX.next.get(rid) || []).filter(x => !x.ev || !x.ev.race || !x.ev.race.st.length || x.i.start >= TODAY);
    const ySel = state.riderSeason && (seasons.includes(state.riderSeason)) ? state.riderSeason : (seasons[0] ?? state.season);
    const career = { pts: 0, wins: 0, gc: 0, pod: 0, top10: 0, days: 0, races: 0, lead: 0 };
    const bySeason = seasons.map(y => { const o = IX.season.get(y).riders.get(rid); for (const k in career) career[k] += o ? o[k] : 0; return [y, o]; });
    const so = IX.season.get(ySel)?.riders.get(rid);
    state.rs = ySel;
    const curT = IX.riderTeam.get(rid)?.get(seasons[0]);
    const mgr = curT != null ? IX.season.get(seasons[0])?.teamMgr.get(curT) : null;
    const kpi = (lbl, v, sub) => `<div class="kpi"><span class="kpi-v">${v}</span><span class="kpi-l">${lbl}</span>${sub ? `<span class="kpi-s">${sub}</span>` : ''}</div>`;

    // results grouped by race for the selected season
    const ents = riderEntries(rid, ySel);
    const byRace = new Map();
    for (const e of ents) { if (!byRace.has(e.r.id)) byRace.set(e.r.id, { r: e.r, list: [] }); byRace.get(e.r.id).list.push(e); }
    const races = [...byRace.values()].sort((a, b) => (b.r.start || '').localeCompare(a.r.start || '') || b.r.id - a.r.id);
    const evOfRace = r => IX.evById.get('r' + r.id);
    const rows = races.map(({ r, list }) => {
      const ev = evOfRace(r);
      const pts = list.reduce((a, e) => a + (e.pts || 0), 0);
      const team = list.find(e => e.t >= 0)?.t;
      if (!r.multi) {
        const e = list.find(x => x.k === 'st') || list[0];
        const extra = list.filter(x => x.k !== 'st' && x.k !== 'GC').map(x => `<span class="chip">${jersey(x.k)}${esc(CLS_SHORT[x.k])} ${ordinal(x.p)}</span>`).join('');
        return `<tr class="rr"><td class="d">${dshort(r.start)}</td><td class="n">${posCell(e.k === 'st' ? e.p : null)}</td><td><a class="el" href="#carrera-${ev.id}" data-hl="${rid}">${esc(r.name)}</a> ${clsBadge(r.cls)} ${extra}</td><td class="n pts">${pts ? fmtN(pts) : ''}</td></tr>`;
      }
      const gc = list.find(x => x.k === 'GC');
      const cls = list.filter(x => ['PTS', 'KOM', 'YOU'].includes(x.k));
      const stages = list.filter(x => x.k === 'st').sort((a, b) => a.si - b.si);
      const lead = r.ld ? Object.values(r.ld).filter(x => x === rid).length : 0;
      const sub = stages.map(x => `<tr class="rs"><td></td><td class="n">${posCell(x.p)}</td><td><span class="muted">${esc(r.st[x.si].l)}</span> ${typeIcon(r.st[x.si].ty)}</td><td class="n pts muted">${x.pts ? fmtN(x.pts) : ''}</td></tr>`).join('')
        + cls.map(x => `<tr class="rs"><td></td><td class="n">${posCell(x.p)}</td><td>${jersey(x.k)}<span class="muted">Clasificación ${esc(CLS_NAME[x.k].toLowerCase())}</span></td><td class="n pts muted">${x.pts ? fmtN(x.pts) : ''}</td></tr>`).join('');
      return `<tr class="rr rr-multi"><td class="d">${drange(r.start, r.end)}</td><td class="n">${gc ? posCell(gc.p) : ''}</td><td><a class="el" href="#carrera-${ev.id}" data-hl="${rid}">${esc(r.name)}</a> ${clsBadge(r.cls)} <span class="muted small">${gc ? 'General' : 'Sin general'}${lead ? ` · ${lead} día${lead > 1 ? 's' : ''} de líder` : ''}</span></td><td class="n pts strong">${pts ? fmtN(pts) : ''}</td></tr>${sub}`;
    }).join('');

    // points per month chart (selected season)
    const months = Array(12).fill(0);
    ents.forEach(e => { const m = +((e.r.end || e.r.start) || '0000-01').slice(5, 7) - 1; months[m] += e.pts || 0; });
    const maxM = Math.max(1, ...months);
    const monthChart = `<svg class="bars" viewBox="0 0 360 120" role="img" aria-label="Puntos por mes en ${ySel}">${months.map((v, i) => { const h = Math.round(90 * v / maxM); return `<g><rect x="${i * 30 + 4}" y="${100 - h}" width="22" height="${h}" rx="2" class="bar${v ? '' : ' bar-0'}"><title>${MESL[i]}: ${fmtN(v)} pts MC</title></rect><text x="${i * 30 + 15}" y="114" class="ax">${MES[i][0].toUpperCase()}</text>${v && h > 14 ? `<text x="${i * 30 + 15}" y="${100 - h + 11}" class="bl">${v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v}</text>` : ''}</g>`; }).join('')}</svg>`;
    // best results (wins list)
    const wins = IX.riderRes[rid].filter(e => e.p === 1 && (e.k === 'st' || (e.k === 'GC' && e.r.multi))).sort((a, b) => (b.r.start || '').localeCompare(a.r.start || ''));
    const winList = wins.slice(0, 14).map(e => `<li><span class="li-date">${e.r.start.slice(0, 4)}</span>${e.k === 'GC' ? jersey('GC') : ''}<a class="el" href="#carrera-${evOfRace(e.r).id}">${esc(e.r.name)}</a><span class="muted small">${e.k === 'GC' ? 'General' : (e.r.multi ? esc(e.r.st[e.si].l) : '')}</span></li>`).join('');
    const nextHtml = nextAll.length ? nextAll.sort((a, b) => a.i.start.localeCompare(b.i.start)).map(x => `<li class="li-race"><span class="li-date">${drange(x.i.start, x.i.end)}</span><div class="li-main"><a class="el" href="#carrera-${x.ev.id}" data-tab="sl" data-hl="${rid}">${esc(x.i.name)}</a> ${clsBadge(x.i.cls)}<div class="li-sub">Inscrito por ${esc(x.e.m || '?')}${x.e.tid >= 0 ? ' · ' + esc(tname(x.e.tid)) : ''}</div></div>${statusPill(x.ev)}</li>`).join('') : '<li class="empty">Su mánager no lo ha inscrito en ninguna carrera próxima.</li>';
    const seasonTable = `<div class="tw"><table class="t t-compact"><thead><tr><th>Temp.</th><th>Equipo</th><th class="n">Vic.</th><th class="n">Pod.</th><th class="n">Pts MC</th></tr></thead><tbody>${bySeason.map(([y, o]) => `<tr${y === ySel ? ' class="hl"' : ''}><td><a href="#corredor-${slug}" data-season="${y}">${y}</a></td><td>${tlink(IX.riderTeam.get(rid)?.get(y))}</td><td class="n">${o ? o.wins || '' : ''}</td><td class="n">${o ? o.pod || '' : ''}</td><td class="n strong">${o ? fmtN(o.pts) : ''}</td></tr>`).join('')}</tbody></table></div>`;
    const rankPos = (() => { const st = IX.season.get(ySel); if (!st || !so) return null; let n = 1; for (const [, o] of st.riders) if (o.pts > so.pts) n++; return n; })();

    return `<header class="ph ph-rider">
        <div class="ph-meta"><span class="eyebrow">Corredor</span>${young(rid, ySel) ? `<span class="jb jb-l">J · jóvenes ${ySel}</span>` : ''}</div>
        <h1 class="h1">${esc(name)}</h1>
        <p class="ph-team">${curT != null && curT >= 0 ? tlink(curT) : '<span class="muted">Sin equipo en resultados</span>'}${mgr ? ` <span class="muted">· mánager ${esc(mgr.m)}</span>` : ''}${D.oid && D.oid[rid] != null ? ` <a class="small" href="${OFFWEB}/ciclistas/${D.oid[rid]}" target="_blank" rel="noopener">Ficha en la web oficial</a>` : ''}</p>
      </header>
      <div class="kpis">
        ${kpi('Victorias', so ? so.wins : 0, `${career.wins} en total`)}
        ${kpi('Generales', so ? so.gc : 0, `${career.gc} en total`)}
        ${kpi('Podios', so ? so.pod : 0, `${career.pod} en total`)}
        ${kpi('Top 10', so ? so.top10 : 0, `${career.top10} en total`)}
        ${kpi('Días de carrera', so ? `${so.days}<small class="kpi-of">/${MAX_DAYS}</small>` : 0, so ? (ySel === IX.seasons[0] ? `${Math.max(0, MAX_DAYS - so.days - (so.planned || 0))} libres${so.planned ? ` · ${so.planned} ya inscritos` : ''}${so.days + (so.planned || 0) > MAX_DAYS ? ' · <b class="warn">supera el máximo</b>' : ''}` : `${career.days} en total`) : '')}
        ${kpi('Días de líder', so ? so.lead : 0, `${career.lead} en total`)}
        ${kpi('Puntos MC', so ? fmtN(so.pts) : 0, rankPos ? `${rankPos}º del ranking ${ySel}` : '')}
      </div>
      ${attrsTable(D.oid ? D.oid[rid] : null)}
      <div class="grid g-rider">
        <div class="col">
          <section class="card"><div class="card-h"><h2 class="h2">Resultados</h2><div class="seg">${seasons.map(y => `<a href="#corredor-${slug}" data-season="${y}" class="${y === ySel ? 'on' : ''}">${y}</a>`).join('')}</div></div>
            ${races.length ? `<div class="tw"><table class="t t-rider"><thead><tr><th>Fecha</th><th class="n">Pos</th><th>Carrera</th><th class="n">Pts MC</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">Sin resultados esta temporada.</p>'}
          </section>
        </div>
        <aside class="col">
          <section class="card"><h2 class="h2">Próximas carreras</h2><ul class="list">${nextHtml}</ul></section>
          <section class="card"><h2 class="h2">Puntos MC por mes · ${ySel}</h2>${monthChart}</section>
          <section class="card"><h2 class="h2">Por temporada</h2>${seasonTable}</section>
          <section class="card"><h2 class="h2">Duelo</h2><p class="muted small">Compara sus puestos con otro corredor en las carreras que disputaron juntos.</p>
            <div class="h2h-f"><input id="h2h" list="h2h-list" placeholder="Escribe un corredor" aria-label="Corredor para comparar" data-rid="${rid}"><datalist id="h2h-list"></datalist></div><div id="h2h-out"></div></section>
          ${wins.length ? `<section class="card"><h2 class="h2">Victorias</h2><ul class="wl">${winList}</ul>${wins.length > 14 ? `<p class="muted small">y ${wins.length - 14} más</p>` : ''}</section>` : ''}
        </aside>
      </div>`;
  }

  // ----- calendar -----
  function pageCalendar() {
    setTitle('Calendario'); setNav('calendario');
    const y = state.season;
    const evs = IX.events.filter(e => e.s === y).sort((a, b) => a.start.localeCompare(b.start) || a.name.localeCompare(b.name));
    const f = state.calFilter || 'all';
    const filt = evs.filter(e => f === 'all' || (f === 'stage' ? (e.end && e.end !== e.start) : f === 'one' ? !(e.end && e.end !== e.start) : f === 'next' ? !e.race : clsTier(e.cls) === f));
    const byMonth = new Map();
    filt.forEach(e => { const m = +e.start.slice(5, 7); if (!byMonth.has(m)) byMonth.set(m, []); byMonth.get(m).push(e); });
    const opts = [['all', 'Todas'], ['next', 'Próximas'], ['stage', 'Por etapas'], ['one', 'De un día'], ['wt1', 'WT / GT'], ['pro', 'Pro']];
    const body = [...byMonth.entries()].map(([m, list]) => `<section class="card cal-m" id="mes-${m}"><h2 class="h2">${MESL[m - 1]} <span class="muted">${list.length}</span></h2>
      <div class="tw"><table class="t t-cal"><tbody>${list.map(e => { const w = winnerOf(e.race); return `<tr class="${e.start <= TODAY && (e.end || e.start) >= TODAY ? 'today' : ''}"><td class="d">${drange(e.start, e.end)}</td><td>${ctry(e.c)}</td><td class="cal-n">${evlink(e)} ${clsBadge(e.cls)}</td><td class="cal-w">${w ? rlink(w[1]) : e.ins ? `<span class="muted small">${e.ins.e.length} equipos inscritos</span>` : ''}</td><td class="cal-s">${statusPill(e)}</td></tr>`; }).join('')}</tbody></table></div></section>`).join('');
    return `<header class="ph"><div class="ph-meta"><span class="eyebrow">Temporada ${y}</span></div><h1 class="h1">Calendario</h1><p class="muted">${evs.length} carreras · ${evs.filter(e => e.race && e.race.st.length).length} con resultados · ${evs.filter(e => !e.race).length} por disputar</p></header>
      <div class="seg seg-wide">${opts.map(([k, l]) => `<a href="#calendario" data-cal="${k}" class="${f === k ? 'on' : ''}">${l}</a>`).join('')}</div>
      <div class="cal">${body || '<p class="empty">No hay carreras con este filtro.</p>'}</div>`;
  }

  // ----- ranking -----
  function pageRanking() {
    setTitle('Ranking'); setNav('ranking');
    const y = state.season;
    const st = IX.season.get(y);
    const mode = state.rankMode || 'pts';
    const onlyJ = !!state.rankJ;
    const perDay = mode === 'pd' || mode === 'p85';
    const list = st ? [...st.riders.entries()].filter(([rid, o]) => (!onlyJ || young(rid)) && (!perDay || o.days >= MIN_PD)) : [];
    const keyf = { pd: pdOf, p85: p85Of, pts: o => o.pts, wins: o => o.wins * 1e6 + o.pod * 1e3 + o.top10, gc: o => o.gc * 1e6 + o.wins, lead: o => o.lead, days: o => o.days, pod: o => o.pod * 1e3 + o.wins }[mode];
    list.sort((a, b) => keyf(b[1]) - keyf(a[1]) || b[1].pts - a[1].pts);
    const top = list.filter(([, o]) => keyf(o) > 0).slice(0, 300);
    const modes = [['pts', 'Puntos'], ['wins', 'Victorias'], ['gc', 'Generales'], ['pod', 'Podios'], ['lead', 'Días de líder'], ['days', 'Días de carrera'], ['pd', 'Pts/día'], ['p85', `A ${MAX_DAYS} días`]];
    const modesNote = perDay ? `<p class="muted small">Puntos por día de competición y lo que sumaría cada corredor si corriera los ${MAX_DAYS} días a ese ritmo (si ya los ha corrido, sus puntos reales). Solo corredores con ${MIN_PD} días o más.</p>` : '';
    return `<header class="ph"><div class="ph-meta"><span class="eyebrow">Temporada ${y}</span></div><h1 class="h1">Ranking de corredores</h1><p class="muted">Puntos MC sumados en etapas, clásicas y clasificaciones finales. Días: corridos de ${MAX_DAYS} posibles, y en pequeño los ya inscritos.${D.official && D.official[y] ? ` <span class="off-badge" title="Resultados, puntos y días sacados de la web oficial de Managercycling">✓ Datos de la web oficial (${new Date(D.official[y].at).toLocaleDateString('es-ES')})</span>` : ''}</p></header>
      <div class="toolbar"><div class="seg">${modes.map(([k, l]) => `<a href="#ranking" data-rank="${k}" class="${mode === k ? 'on' : ''}">${l}</a>`).join('')}</div>

  // ----- stats -----

    // races with most different winners etc.

      <div class="boards">

        ${board('Más top 10', 'top10')}

  // ----- historia: carreras míticas, récords e hitos -----
  const RACE_ALIAS = [
    [/^tour(de)?france$/, 'tour-de-france'], [/giro.?d.?italia/, 'giro-d-italia'], [/vuelta.*espana|^lavuelta/, 'vuelta-a-espana'],
    [/rondevanvlaanderen|tourdesflandres/, 'ronde-van-vlaanderen'], [/^omloop(het)?nieuwsblad/, 'omloop-nieuwsblad'], [/cyclassics/, 'cyclassics-hamburg'],
    [/donostia|dssk|sansebastian.*klasikoa/, 'klasikoa-san-sebastian'], [/cadelevans/, 'cadel-evans-great-ocean-road-race'],
    [/benelux|renewi/, 'renewi-tour'], [/bruggedepanne/, 'classic-brugge-de-panne'], [/^e3/, 'e3-classic'],
    [/dwarsdoorvlaanderen/, 'dwars-door-vlaanderen'], [/bretagneclassic/, 'bretagne-classic'], [/quebec/, 'gp-quebec'], [/montreal/, 'gp-montreal'],
    [/guangxi/, 'tour-of-guangxi'], [/tourdownunder/, 'tour-down-under'], [/tirreno/, 'tirreno-adriatico'], [/parisnice/, 'paris-nice'],
    [/eschborn/, 'eschborn-frankfurt'], [/gentwevelgem/, 'gent-wevelgem'], [/milanosanremo/, 'milano-sanremo'], [/parisroubaix/, 'paris-roubaix'],
    [/liegebastogneliege/, 'liege-bastogne-liege'], [/lombardia/, 'il-lombardia'], [/flechewallonne/, 'la-fleche-wallonne'], [/amstelgold/, 'amstel-gold-race'],
    [/criteriumdudauphine|tourauvergnerhonealpes/, 'criterium-du-dauphine'], [/catalunya/, 'volta-a-catalunya'], [/itzulia|paisvasco/, 'itzulia'],
  ];
  const STOP = new Set(['de', 'del', 'la', 'le', 'les', 'el', 'the', 'of', 'men', 'elite', 'a', 'y', 'et', 'des']);
  function raceKey(name, cls) {
    const toks = MC.fold(name).replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(t => t && !STOP.has(t) && !/^(19|20)\d\d$/.test(t));
    const compact = toks.join('');
    let k = null;
    for (const [re, v] of RACE_ALIAS) if (re.test(compact)) { k = v; break; }
    if (!k) k = toks.join('-') || 'x';
    if (/U$/.test(cls || '') || /u23|espoirs|nextgen|piccolo|baby|juniors|sub23|under23/.test(compact)) k = k.replace(/-u23$/, '') + '-u23';
    const tt = /\.TT$/.test(cls || '') || /(^| )(itt|cri|contrarreloj)( |$)/.test(toks.join(' '));
    if (/^(WC|OG|NC)\./.test(cls || '') || /championships|olympic|campeonato/.test(compact)) k = k.replace(/-?(itt|cri)(-|$)/g, '$2').replace(/-$/, '') + (tt ? '-cri' : '-ruta');
    return k;
  }
  const isGT = r => /GT/.test(r.cls || '') || /^(tour-de-france|giro-d-italia|vuelta-a-espana)$/.test(r.hk);
  function raceCat(eds) {
    const c = eds.map(e => e.r.cls || '').join(' ');
    const k = eds[0].r.hk;
    if (/GT/.test(c) || /^(tour-de-france|giro-d-italia|vuelta-a-espana)$/.test(k)) return 'gv';
    if (/1\.WT1/.test(c)) return 'mon';
    if (/WC\.|OG\./.test(c)) return 'mun';
    if (/NC\./.test(c)) return 'nac';
    if (/2\.(UWT|WT)/.test(c)) return 'wte';
    if (/1\.(UWT|WT)/.test(c)) return 'wtc';
    if (/Pro/.test(c)) return 'pro';
    return 'otr';
  }
  const CAT = { gv: 'Grandes Vueltas', mon: 'Monumentos', mun: 'Mundiales y JJOO', wte: 'Vueltas WorldTour', wtc: 'Clásicas WorldTour', pro: 'ProSeries', nac: 'Campeonatos', otr: 'Resto de carreras' };
  const CAT_ORDER = ['gv', 'mon', 'mun', 'wte', 'wtc', 'pro', 'nac', 'otr'];
  const podiumOf = r => (r.multi && r.cl.GC && r.cl.GC.length ? r.cl.GC : (r.st[r.st.length - 1] || { rows: [] }).rows).filter(x => x[1] >= 0).slice(0, 3);

  let HX = null;
  function history() {
    if (HX && HX.ix === IX) return HX;
    const groups = new Map();
    for (const ev of IX.events) {
      const r = ev.race;
      if (!r || !r.st.length || !winnerOf(r)) continue;
      if (r.multi && ev.end && ev.end >= TODAY && status(ev).k === 'live') continue; // aún en curso
      r.hk = r.hk || raceKey(r.name, r.cls);
      if (!groups.has(r.hk)) groups.set(r.hk, { key: r.hk, eds: [] });
      groups.get(r.hk).eds.push({ ev, r, s: r.s });
    }
    const races = [];
    for (const g of groups.values()) {
      g.eds.sort((a, b) => a.s - b.s || a.r.start.localeCompare(b.r.start));
      const last = g.eds[g.eds.length - 1];
      g.name = last.r.name; g.cat = raceCat(g.eds); g.multi = g.eds.some(e => e.r.multi); g.cls = last.r.cls;
      g.wins = new Map(); g.pods = new Map(); g.stw = new Map(); g.ld = new Map();
      const push = (m, rid, v) => { if (!m.has(rid)) m.set(rid, []); m.get(rid).push(v); };
      for (const e of g.eds) {
        e.pod = podiumOf(e.r); e.w = e.pod[0];
        if (e.w) push(g.wins, e.w[1], e);
        e.pod.forEach((x, i) => push(g.pods, x[1], { e, p: i + 1 }));
        if (e.r.multi) e.r.st.forEach((s, si) => { const w = s.rows[0]; if (w && w[0] === 1 && w[1] >= 0) push(g.stw, w[1], { e, si }); });
        if (e.r.ld) Object.values(e.r.ld).forEach(rid => rid >= 0 && push(g.ld, rid, e));
      }
      g.rec = [...g.wins.entries()].sort((a, b) => b[1].length - a[1].length || a[1][0].s - b[1][0].s);
      g.slug = g.key;
      races.push(g);
    }
    races.sort((a, b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat) || b.eds.length - a.eds.length || a.name.localeCompare(b.name));
    HX = { ix: IX, races, byKey: new Map(races.map(g => [g.key, g])) };
    return HX;
  }
  const hlink = (g, label) => `<a class="el" href="#historia-${g.slug}">${esc(label || g.name)}</a>`;
  const yearsOf = list => list.map(e => `<a href="#carrera-${e.ev.id}">${e.s}</a>`).join(', ');

  function pageMiticas() {
    setTitle('Carreras míticas'); setNav('miticas'); state.rs = -1;
    const H = history();
    const cat = state.histCat || 'top';
    const shown = H.races.filter(g => cat === 'top' ? ['gv', 'mon', 'mun'].includes(g.cat) : cat === 'all' ? true : g.cat === cat);
    const card = g => {
      const rec = g.rec[0]; const n = rec ? rec[1].length : 0;
      const holders = g.rec.filter(x => x[1].length === n);
      const lastE = g.eds[g.eds.length - 1];
      return `<section class="card mt"><div class="mt-h">${hlink(g)} ${clsBadge(g.cls)}</div>
        <p class="muted small">${g.eds.length} edición${g.eds.length > 1 ? 'es' : ''} en MC · ${g.eds[0].s}–${lastE.s}</p>
        <ol class="mt-w">${g.eds.slice().reverse().map(e => `<li><span class="li-date">${e.s}</span>${e.w ? rlink(e.w[1]) : '—'}<span class="muted small">${e.w ? esc(tname(e.w[2])) : ''}</span></li>`).join('')}</ol>

    const body = cat === 'top' || cat === 'gv' || cat === 'mon' || cat === 'mun'
      ? `<div class="mts">${shown.map(card).join('')}</div>`
      : `<div class="filter"><input id="tfilter" type="search" placeholder="Buscar carrera o corredor" aria-label="Filtrar carreras"></div>${table(shown)}`;
    return `<header class="ph"><div class="ph-meta"><span class="eyebrow">Historia de MC · ${IX.seasons[IX.seasons.length - 1]}–${IX.seasons[0]}</span></div><h1 class="h1">Carreras míticas</h1>
      <p class="muted">Palmarés de cada carrera en todas las temporadas de Managercycling: quién la ha ganado, cuándo y quién tiene el récord de victorias. <a href="#hitos">Ver los hitos y récords de MC</a></p></header>
      <div class="seg seg-wide">${opts.map(([k, l]) => `<a href="#miticas" data-hcat="${k}" class="${cat === k ? 'on' : ''}">${l}</a>`).join('')}</div>
      ${body}`;
  }

  function pageHitos() {

    const gv = H.races.filter(g => g.cat === 'gv'), mon = H.races.filter(g => g.cat === 'mon');
    const cnt = (list, f) => { const m = new Map(); list.forEach(g => g.eds.forEach(e => { const v = f(e, g); if (v) (Array.isArray(v) ? v : [v]).forEach(([rid, x]) => { if (rid < 0) return; if (!m.has(rid)) m.set(rid, []); m.get(rid).push(x); }); })); return [...m.entries()].sort((a, b) => b[1].length - a[1].length); };
    const gcGV = cnt(gv, e => e.w && [[e.w[1], { e, g: e }]]);
    const stGV = cnt(gv, e => e.r.st.map(s => s.rows[0] && s.rows[0][0] === 1 ? [s.rows[0][1], e] : null).filter(Boolean));
    const monW = cnt(mon, e => e.w && [[e.w[1], e]]);
    const gvByRider = new Map(); gv.forEach(g => g.eds.forEach(e => { if (!e.w) return; const rid = e.w[1]; if (!gvByRider.has(rid)) gvByRider.set(rid, new Map()); gvByRider.get(rid).set(g.key, (gvByRider.get(rid).get(g.key) || []).concat(e)); }));
    const triple = [...gvByRider.entries()].filter(([, m]) => ['tour-de-france', 'giro-d-italia', 'vuelta-a-espana'].every(k => m.has(k)));
    const doubles = []; { const bySeason = new Map(); gv.forEach(g => g.eds.forEach(e => { if (!e.w) return; const k = e.s + ':' + e.w[1]; if (!bySeason.has(k)) bySeason.set(k, []); bySeason.get(k).push(g); })); for (const [k, l] of bySeason) if (l.length > 1) doubles.push({ y: +k.split(':')[0], rid: +k.split(':')[1], l }); }
    // victorias y puntos por temporada

    const topBy = (f, n = 10) => seasonRows.filter(x => f(x.o) > 0).sort((a, b) => f(b.o) - f(a.o)).slice(0, n);
    const teamRows = []; for (const [y, st] of IX.season) for (const [tid, o] of st.teams) if (tid >= 0) teamRows.push({ y, tid, o });
    // más etapas en una sola carrera
    const stOne = []; H.races.forEach(g => g.eds.forEach(e => { if (!e.r.multi) return; const m = new Map(); e.r.st.forEach(s => { const w = s.rows[0]; if (w && w[0] === 1 && w[1] >= 0) m.set(w[1], (m.get(w[1]) || 0) + 1); }); for (const [rid, k] of m) if (k >= 3) stOne.push({ rid, k, e, g }); }));
    stOne.sort((a, b) => b.k - a.k || (isGT(b.e.r) - isGT(a.e.r)));
    // récord de victorias en una misma carrera
    const sameRace = [], sameNac = []; H.races.forEach(g => g.wins.forEach((l, rid) => { if (l.length >= 2) (g.cat === 'nac' ? sameNac : sameRace).push({ rid, l, g }); }));
    sameNac.sort((a, b) => b.l.length - a.l.length);
    sameRace.sort((a, b) => b.l.length - a.l.length || CAT_ORDER.indexOf(a.g.cat) - CAT_ORDER.indexOf(b.g.cat));
    // rachas: victorias consecutivas en la misma carrera
    const streaks = []; H.races.filter(g => g.cat !== 'nac').forEach(g => { let cur = null, run = []; g.eds.forEach(e => { const rid = e.w ? e.w[1] : null; if (rid === cur && run.length && e.s === run[run.length - 1].s + 1) run.push(e); else { if (run.length >= 2) streaks.push({ rid: cur, run, g }); cur = rid; run = [e]; } }); if (run.length >= 2) streaks.push({ rid: cur, run, g }); });
    streaks.sort((a, b) => b.run.length - a.run.length || CAT_ORDER.indexOf(a.g.cat) - CAT_ORDER.indexOf(b.g.cat));
    // carreras distintas ganadas
    const distinct = new Map(); H.races.forEach(g => g.wins.forEach((l, rid) => distinct.set(rid, (distinct.get(rid) || 0) + 1)));
    const distinctTop = [...distinct.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);

    const career = new Map(); for (const [, st] of IX.season) for (const [rid, o] of st.riders) { const c = career.get(rid) || { wins: 0, pts: 0, lead: 0 }; c.wins += o.wins; c.pts += o.pts; c.lead += o.lead; career.set(rid, c); }

    const lb = (title, items, note = '') => `<section class="card"><h2 class="h2">${title}</h2>${note ? `<p class="muted small">${note}</p>` : ''}<ol class="lb">${items.length ? items.join('') : '<li class="empty">Aún no ha pasado.</li>'}</ol></section>`;

    const evY = e => `<a href="#carrera-${e.ev.id}">${e.s}</a>`;
    const short = g => esc(g.name.replace(/^La Vuelta ciclista a España$/i, 'Vuelta').replace(/^Giro d.?Italia$/i, 'Giro').replace(/^Tour de France$/i, 'Tour'));
    const tied = (list, n, f) => { const l = list.filter(x => f(x) === n); return l.length > 1 ? `${rlink(l[0][0] ?? l[0].rid)} <span class="muted small">y ${l.length - 1} más</span>` : rlink(l[0][0] ?? l[0].rid); };
    const cTop = careerTop('wins');
    const hero = [
      gcGV[0] ? ['Rey de las Grandes Vueltas', tied(gcGV, gcGV[0][1].length, x => x[1].length), `${gcGV[0][1].length} generales`] : null,

    return `<header class="ph"><div class="ph-meta"><span class="eyebrow">Historia de MC · ${IX.seasons[IX.seasons.length - 1]}–${IX.seasons[0]}</span></div><h1 class="h1">Hitos y récords de MC</h1>
        <p class="muted">Los récords de todas las temporadas de Managercycling. <a href="#miticas">Ver el palmarés de cada carrera</a></p></header>
      <div class="kpis">${hero.map(([l, who, v]) => `<div class="kpi kpi-rec"><span class="kpi-l">${l}</span><span class="kpi-who">${who}</span><span class="kpi-s">${v}</span></div>`).join('')}</div>
      <div class="boards">
        ${lb('Más Grandes Vueltas', gcGV.slice(0, 10).map(([rid, l], i) => li(i, rlink(rid), l.map(x => `${short(H.byKey.get(x.e.r.hk))} ${evY(x.e)}`).join(' · '), l.length)))}
        ${lb('Triple corona', triple.map(([rid, m], i) => li(i, rlink(rid), ['giro-d-italia', 'tour-de-france', 'vuelta-a-espana'].map(k => short(H.byKey.get(k)) + ' ' + m.get(k).map(evY).join(', ')).join(' · '), '3/3')), 'Ganadores de Giro, Tour y Vuelta')}
        ${lb('Dobletes en una temporada', doubles.sort((a, b) => b.l.length - a.l.length || b.y - a.y).map((d, i) => li(i, rlink(d.rid), d.l.map(short).join(' + '), d.y)), 'Dos o más Grandes Vueltas el mismo año')}
        ${lb('Más Monumentos', monW.slice(0, 10).map(([rid, l], i) => li(i, rlink(rid), l.map(e => `${short(H.byKey.get(e.r.hk))} ${evY(e)}`).join(' · '), l.length)))}
        ${lb('Más etapas en Grandes Vueltas', stGV.slice(0, 10).map(([rid, l], i) => li(i, rlink(rid), '', l.length)))}
        ${lb('Más etapas en una sola carrera', stOne.slice(0, 10).map((x, i) => li(i, rlink(x.rid), `${hlink(x.g)} ${evY(x.e)}`, x.k)))}
        ${lb('Más victorias en una misma carrera', sameRace.slice(0, 12).map((x, i) => li(i, rlink(x.rid), `${hlink(x.g)} · ${yearsOf(x.l)}`, x.l.length)))}
        ${lb('Campeonatos: más títulos', sameNac.slice(0, 10).map((x, i) => li(i, rlink(x.rid), `${hlink(x.g)} · ${yearsOf(x.l)}`, x.l.length)))}
        ${lb('Victorias seguidas en la misma carrera', streaks.slice(0, 10).map((x, i) => li(i, rlink(x.rid), `${hlink(x.g)} · ${x.run[0].s}–${x.run[x.run.length - 1].s}`, x.run.length)))}
        ${lb('Más victorias en una temporada', topBy(o => o.wins).map((x, i) => li(i, rlink(x.rid), `${x.y} · ${tname(x.o.lastT) ? esc(tname(x.o.lastT)) : ''}`, x.o.wins)))}
        ${lb('Más puntos MC en una temporada', topBy(o => o.pts).map((x, i) => li(i, rlink(x.rid), String(x.y), fmtN(x.o.pts))), 'Los baremos de puntos han cambiado entre temporadas')}
        ${lb('Más victorias en MC', careerTop('wins').map(([rid, c], i) => li(i, rlink(rid), '', c.wins)), 'Etapas, clásicas y generales')}
        ${lb('Más carreras distintas ganadas', distinctTop.map(([rid, k], i) => li(i, rlink(rid), '', k)))}

        ${lb('Equipos: más victorias en una temporada', teamRows.filter(x => x.o.wins).sort((a, b) => b.o.wins - a.o.wins).slice(0, 10).map((x, i) => li(i, tlink(x.tid), String(x.y), x.o.wins)))}
        ${lb('Equipos: más puntos MC en una temporada', teamRows.filter(x => x.o.pts || x.o.rpts).sort((a, b) => (b.o.pts || b.o.rpts) - (a.o.pts || a.o.rpts)).slice(0, 10).map((x, i) => li(i, tlink(x.tid), String(x.y), fmtN(x.o.pts || x.o.rpts))))}

      </div>`;
  }

  // ---------- puntos por día y proyección a 85 días ----------
  const MIN_PD = 10; // días mínimos para entrar en la clasificación de puntos por día
  const pdOf = o => o && o.days > 0 ? o.pts / o.days : 0;
  const p85Of = o => o && o.days > 0 ? (o.days >= MAX_DAYS ? o.pts : pdOf(o) * MAX_DAYS) : 0;
  // equipo: puntos por día de sus corredores y lo que habría sumado con todos ellos a 85 días
  function teamPD(st, tid) {
    const t = st.teams.get(tid); if (!t) return null;
    let days = 0, rp = 0, proj = 0, n = 0;
    for (const [rid, o] of st.riders) if (o.lastT === tid) { n++; days += o.days; rp += o.pts; proj += p85Of(o); }
    const tot = t.pts || t.rpts, extra = Math.max(0, tot - rp); // clasificación por equipos
    return { n, days, pd: days ? rp / days : 0, proj: proj + (rp > 0 ? extra * proj / rp : 0), tot, used: n ? days / (n * MAX_DAYS) : 0 };
  }

  // ---------- mercado: traspasos confirmados y cómo habría quedado la temporada ----------
  function marketSim(y, base) {
    const M = D.market, st = IX.season.get(y);
    if (!M || !st) return null;
    const ridOfOid = new Map(Object.entries(D.oid || {}).map(([r, o]) => [o, +r]));
    const tidOf = name => { const k = MC.teamKey(name || ''); const i = D.teams.findIndex(t => MC.teamKey(t) === k); return i >= 0 ? i : 'n:' + name; };
    const val = rid => { const o = rid != null ? st.riders.get(rid) : null; return o ? (base === 'p85' ? p85Of(o) : o.pts) : 0; };
    // destino final de cada corredor (hay quien cambia dos veces)
    const tr = M.transfers.slice().sort((a, b) => a[0].localeCompare(b[0]) || b[5] - a[5]);
    const mv = new Map();
    for (const [d, oid, name, from, to] of tr) { const m = mv.get(oid) || { oid, name, from: tidOf(from), fromName: from, path: [] }; m.to = tidOf(to); m.toName = to; m.path.push(to); m.d = d; mv.set(oid, m); }
    const ret = new Map(M.retired.map(([d, oid, name, team, est]) => [oid, { oid, name, team: tidOf(team), teamName: team, est, d }]));
    const T = new Map();
    const TT = (tid, name) => { if (!T.has(tid)) { const o = typeof tid === 'number' ? (base === 'p85' ? (teamPD(st, tid) || {}).proj : (st.teams.get(tid) || {}).pts) : 0; T.set(tid, { tid, name: name || (typeof tid === 'number' ? tname(tid) : String(tid).slice(2)), base: o || 0, ins: [], outs: [], ret: [] }); } return T.get(tid); };
    for (const [tid, o] of st.teams) if (tid >= 0 && o.riders.size >= 3) TT(tid);
    for (const m of mv.values()) {
      const rid = ridOfOid.get(m.oid), v = val(rid), cur = rid != null && st.riders.get(rid) ? st.riders.get(rid).lastT : m.from;
      const fromT = cur >= 0 ? cur : m.from;
      if (fromT === m.to) continue;
      TT(fromT, m.fromName).outs.push({ ...m, rid, v });
      TT(m.to, m.toName).ins.push({ ...m, rid, v });
    }
    for (const r of ret.values()) {
      if (mv.has(r.oid)) continue;
      const rid = ridOfOid.get(r.oid), v = val(rid), cur = rid != null && st.riders.get(rid) ? st.riders.get(rid).lastT : r.team;
      TT(cur >= 0 ? cur : r.team, r.teamName).ret.push({ ...r, rid, v });
    }
    const list = [...T.values()];
    for (const t of list) { t.gin = t.ins.reduce((a, x) => a + x.v, 0); t.gout = t.outs.reduce((a, x) => a + x.v, 0); t.gret = t.ret.reduce((a, x) => a + x.v, 0); t.sim = t.base + t.gin - t.gout - t.gret; }
    list.sort((a, b) => b.base - a.base).forEach((t, i) => t.r0 = i + 1);
    list.sort((a, b) => b.sim - a.sim).forEach((t, i) => t.r1 = i + 1);
    return { M, list, moves: mv, ret };
  }
  function pageMarket() {
    setTitle('Mercado'); setNav('mercado');
    const y = IX.seasons[0], base = state.mktBase || 'pts';
    const S = marketSim(y, base);
    if (!S) return `<header class="ph"><h1 class="h1">Mercado</h1><p class="muted">Todavía no hay datos del mercado de la web oficial.</p></header>`;

      ${t.ins.length ? `<p class="small strong">Altas</p><ul class="mk-l">${mvList(t.ins, '+')}</ul>` : ''}${t.outs.length ? `<p class="small strong">Bajas</p><ul class="mk-l">${mvList(t.outs, '−')}</ul>` : ''}${t.ret.length ? `<p class="small strong">Retirados</p><ul class="mk-l">${mvList(t.ret, '×')}</ul>` : ''}</details></td>
      <td class="n">${fmtN(t.base)} <span class="muted small">(${t.r0}º)</span></td><td class="n up">${t.gin ? '+' + fmtN(t.gin) : ''}</td><td class="n down">${t.gout + t.gret ? '−' + fmtN(t.gout + t.gret) : ''}</td><td class="n strong">${fmtN(t.sim)}</td><td class="n">${arrow(t)}</td></tr>`).join('');
    // acuerdos (como en la web oficial)
    const groups = new Map(); for (const x of M.transfers) { if (!groups.has(x[5])) groups.set(x[5], []); groups.get(x[5]).push(x); }
    const ridOfOid = new Map(Object.entries(D.oid || {}).map(([r, o]) => [o, +r]));

      <div class="seg seg-wide"><a href="#mercado" data-mkt="pts" class="${base === 'pts' ? 'on' : ''}">Con los puntos reales de ${y}</a><a href="#mercado" data-mkt="p85" class="${base === 'p85' ? 'on' : ''}">Con la proyección a ${MAX_DAYS} días</a></div>

  // ---------- predicción de la próxima temporada ----------
  function pagePred() {

    const view = state.predView || 'eq';
    const ridOfOid = new Map(Object.entries(D.oid || {}).map(([r, o]) => [o, +r]));
    const st = IX.season.get(P.from);
    const tidOf = name => { const k = MC.teamKey(name || ''); return D.teams.findIndex(t => MC.teamKey(t) === k); };
    const rl = (oid, name) => { const r = ridOfOid.get(oid); return r != null ? `<a class="rl" href="#corredor-${IX.riderSlug[r]}">${esc(rname(r))}</a>` : esc(String(name).replace(/\s*\(J\)\s*/, '')); };
    const clean = n => esc(String(n).replace(/\s*\(J\)\s*/, ''));
    const q = P.quality;
    // categoría 2027 (con ascensos y descensos) y de 2026
    const div27 = new Map(P.teams.map(t => [t[0], t[5] || ''])), div26 = new Map(P.teams.map(t => [t[0], t[6] || '']));
    const dvB = d => d ? `<span class="dv dv-${d.toLowerCase()}" title="${d === 'WT' ? 'WorldTour' : 'Continental Profesional'}">${d}</span>` : '';
    const move = n => { const a = div26.get(n), b = div27.get(n); return a && b && a !== b ? (b === 'WT' ? '<span class="up small" title="Sube al WorldTour">▲ sube</span>' : '<span class="down small" title="Baja a Continental Profesional">▼ baja</span>') : ''; };
    const tl = (tid, name) => tid >= 0 ? `<a class="tl strongish" href="#equipo-${IX.teamSlug[tid]}">${esc(tname(tid))}</a>` : esc(name);
    const head = `<header class="ph"><div class="ph-meta"><span class="eyebrow">Temporada ${P.year} · estimación</span></div><h1 class="h1">Predicción clasificación ${P.year}</h1>
      <p class="muted">Puntos estimados para ${P.year} con las plantillas (traspasos incluidos) y las medias nuevas de la web oficial. El modelo aprende de los ${q.n} corredores de ${P.from} qué puntos saca cada perfil de atributos, edad, condición de joven y papel en su equipo, y lo aplica a las medias de ${P.year}. Los jóvenes (J) que lo siguen siendo suman además su clasificación de jóvenes, y los que crecen mucho de media lo notan en la predicción.</p>
      <div class="pq"><span title="Validación cruzada: cada corredor de ${P.from} se predice con un modelo que no lo ha visto">Acierto comprobado con ${P.from}</span><b>${Math.round(q.corr * 100)}%</b><small>correlación por corredor</small><b>${Math.round(q.teamCorr * 100)}%</b><small>por equipos</small><b>${String(Math.round(q.r2 * 100))}%</b><small>de la variación explicada</small></div></header>`;
    const seg = `<div class="seg seg-wide">${[['eq', 'Equipos'], ['co', 'Corredores'], ['jo', 'Jóvenes'], ['su', 'Más suben']].map(([k, l]) => `<a href="#prediccion" data-pview="${k}" class="${view === k ? 'on' : ''}">${l}</a>`).join('')}</div>`;
    if (view === 'eq') {
      const real = st ? [...st.teams.entries()].filter(([t, o]) => t >= 0 && o.riders.size >= 3).sort((a, b) => (b[1].pts || b[1].rpts) - (a[1].pts || a[1].rpts)) : [];
      const realRank = new Map(real.map(([t, o], i) => [t, { r: i + 1, pts: o.pts || o.rpts }]));
      const byTeam = new Map(); for (const r of P.riders) { if (!byTeam.has(r[2])) byTeam.set(r[2], []); byTeam.get(r[2]).push(r); }
      const inDiv = new Map(); { const c = {}; for (const t of P.teams) { const d = t[5] || '?'; c[d] = (c[d] || 0) + 1; inDiv.set(t[0], `${c[d]}º ${d}`); } }
      const rows = P.teams.map((t, i) => {
        const tid = tidOf(t[0]), rr = realRank.get(tid), d = rr ? rr.r - (i + 1) : null;
        const top = (byTeam.get(t[0]) || []).slice(0, 10);
        return `<tr><td class="n">${i + 1}</td><td>${tl(tid, t[0])}${dvB(t[5])} ${move(t[0])}${t[1] < 28 ? ` <span class="muted small" title="Aún le faltan corredores (draft, Rastro, agentes libres)">${t[1]} corredores</span>` : ''}<details class="mk-d"><summary class="small muted">Sus 10 mejores según la predicción</summary><ul class="mk-l">${top.map(r => `<li>${rl(r[0], r[1])}${r[5] ? '<span class="jb">J</span>' : ''} <span class="muted small">MED ${fmtN(r[3])}${r[7] && r[7] !== r[2] ? ` · llega de ${esc(r[7])}` : ''}</span><span class="n">${fmtN(r[10])}</span></li>`).join('')}</ul></details></td>
          <td class="n">${fmtN(t[2])}</td><td class="n muted">${fmtN(t[3])}</td><td class="n strong">${fmtN(t[4])}</td><td class="n small">${t[5] ? inDiv.get(t[0]) : ''}</td><td class="n muted">${rr ? `${fmtN(rr.pts)} (${rr.r}º)` : '—'}</td><td class="n">${d == null ? '' : d > 0 ? `<span class="up">▲${d}</span>` : d < 0 ? `<span class="down">▼${-d}</span>` : '<span class="muted">=</span>'}</td></tr>`;
      }).join('');
      const DVI = P.div;
      const divNote = DVI ? `<p class="muted small"><strong>Ascensos y descensos:</strong> según la clasificación por equipos de ${P.from}, suben al WorldTour ${DVI.up.map(esc).join(', ')} y bajan a Continental Profesional ${DVI.down.map(esc).join(', ')}. La categoría cambia el calendario: en ${P.from} los WT corrieron de media ${String(DVI.days.WT).replace('.', ',')} días por corredor y los CP ${String(DVI.days.CP).replace('.', ',')}, y los CP solo entran en las grandes carreras por invitación (además corren las sub-23). Con los mismos atributos, un corredor de un WT saca un ${Math.round((DVI.wtRatio - 1) * 100)}% más de puntos por día que en un CP; la predicción lo aplica a los que cambian de categoría, junto con los días que correrán.</p>` : '';
      return `${head}${seg}${divNote}<p class="muted small">Puntos de equipo estimados = puntos de sus corredores + su parte de la clasificación por equipos. Las plantillas de ${P.year} aún no están completas (faltan el draft, el Rastro y los agentes libres): los equipos con menos corredores todavía pueden sumar.</p>
        <section class="card"><div class="tw"><table class="t t-rank"><thead><tr><th class="n">#</th><th>Equipo ${P.year}</th><th class="n">De sus corredores</th><th class="n">Clas. equipos</th><th class="n">Pts ${P.year} (estim.)</th><th class="n" title="Puesto dentro de su categoría en ${P.year}">En su categoría</th><th class="n">Real ${P.from}</th><th class="n">Puesto</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
    }
    let list = P.riders.slice();
    if (view === 'jo') list = list.filter(r => r[5]);
    if (view === 'su') list = list.filter(r => r[9] >= 20).sort((a, b) => (b[10] - b[8]) - (a[10] - a[8]));
    const lim = 300;
    // atributos como en la web oficial: los de la próxima temporada o los de esta
    const ay = state.predAttr || '';
    const AK = D.attrs ? D.attrs.keys.slice(0, 14) : [];
    const aCells = r => { if (!ay) return ''; const a = attrsOf(r[0], ay), b = ay == P.year ? attrsOf(r[0], P.from) : null; return AK.map((k, i) => { const v = a ? a[i] : null, d = b && v != null ? v - b[i] : 0; return `<td class="n">${chip(v, k)}${d ? `<div class="sub small ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}</div>` : ''}</td>`; }).join(''); };
    const aHead = ay ? AK.map(k => `<th class="n" title="${ATTR_NAME[k]}">${k}</th>`).join('') : '';
    const aSeg = D.attrs ? `<div class="seg"><a href="#prediccion" data-pattr="" class="${!ay ? 'on' : ''}">Sin atributos</a><a href="#prediccion" data-pattr="${P.from}" class="${ay == P.from ? 'on' : ''}">Atributos ${P.from}</a><a href="#prediccion" data-pattr="${P.year}" class="${ay == P.year ? 'on' : ''}">Atributos ${P.year}</a></div>` : '';
    const rows = list.slice(0, lim).map((r, i) => {
      const dm = r[4] != null ? r[3] - r[4] : 0, dp = r[10] - r[8];
      return `<tr><td class="n">${i + 1}</td><td class="rider">${rl(r[0], r[1])}${r[5] ? '<span class="jb" title="Sigue siendo joven en ' + P.year + '">J</span>' : ''}</td><td class="team">${esc(r[2])}${dvB(div27.get(r[2]))}${r[7] && r[7] !== r[2] ? `<div class="sub muted small">antes ${esc(r[7])}</div>` : ''}</td><td class="n">${r[6] || ''}</td>
        ${aCells(r)}<td class="n">${ay ? chip(ay == P.year ? r[3] : r[4], 'MED') : fmtN(r[3])} ${dm && ay != P.from ? `<span class="${dm > 0 ? 'up' : 'down'} small">${dm > 0 ? '+' : ''}${fmtN(dm)}</span>` : ''}</td><td class="n muted">${fmtN(r[8])} <small>(${r[9]} d)</small></td><td class="n strong">${fmtN(r[10])}${r[12] ? `<div class="sub muted small">${fmtN(r[12])} de jóvenes</div>` : ''}</td><td class="n ${dp > 0 ? 'up' : 'down'}">${dp > 0 ? '+' : ''}${fmtN(dp)}</td></tr>`;
    }).join('');
    const note = view === 'jo' ? `Corredores que seguirán siendo jóvenes (J) en ${P.year}: además de lo que da su media, suman la clasificación de jóvenes de cada carrera.` : view === 'su' ? `Los que más puntos ganarían respecto a ${P.from}: suben mucho de media, cambian a un equipo donde tendrán más galones o el año pasado corrieron pocos días.` : `Todos los corredores con equipo en ${P.year}, ordenados por los puntos estimados. Se supone que corren los mismos días que en ${P.from} (80 si corrieron poco).`;
    return `${head}${seg}<p class="muted small">${note}</p><div class="toolbar">${aSeg}<div class="filter"><input id="tfilter" type="search" placeholder="Buscar corredor o equipo" aria-label="Filtrar"></div></div>
      <section class="card"><div class="tw"><table class="t t-rank${ay ? ' t-attrs' : ''}" data-filter><thead><tr><th class="n">#</th><th>Corredor</th><th>Equipo ${P.year}</th><th class="n">Edad</th>${aHead}<th class="n">MED ${ay || P.year}</th><th class="n">Pts ${P.from}</th><th class="n">Pts ${P.year} (estim.)</th><th class="n">Cambio</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }
  // ---------- noticias (redacción automática a partir de los resultados) ----------
  // Cada noticia se escribe sola con los datos: quién gana, por cuánto, qué supone en su temporada, en la
  // historia de la carrera, en el ranking… El texto varía según el caso para que no suenen todas iguales.
  const NEWS_CATS = [['all', 'Todas'], ['race', 'Carreras'], ['vuelta', 'Vueltas'], ['rank', 'Ranking'], ['rec', 'Récords'], ['merc', 'Mercado'], ['prev', 'Previas']];
  const ord = n => n + 'ª';
  const numW = n => ['', 'una', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez'][n] || String(n);
  const hsh = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
  const pick = (seed, arr) => arr[hsh(seed) % arr.length];
  const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const raceW = r => /GT1/.test(r.cls || '') ? 10 : /GT|1\.WT1/.test(r.cls || '') ? 8 : /WT|WC|OG/.test(r.cls || '') ? 6 : /Pro/.test(r.cls || '') ? 4 : /^NC/.test(r.cls || '') ? 2 : 3;
  const gapTxt = v => { v = String(v || '').trim(); if (!v) return ''; if (/^s\.?\s*t\.?$/i.test(v)) return 'en el mismo tiempo'; if (/^\+/.test(v)) { const g = v.replace(/^\+\s*/, ''); return 'a ' + esc(/^\d+$/.test(g) ? g + ' s' : g); } return ''; };
  const sur = rid => esc(rname(rid));

  let NX = null;
  function buildNews(y) {
    if (NX && NX.ix === IX && NX.y === y) return NX.list;
    const out = [];
    const evs = IX.events.filter(e => e.s === y && e.race && e.race.st.length);
    const H = history();
    // victorias de la temporada en orden de fecha (etapas día a día, generales al final)
    const wins = [];
    for (const e of evs) {
      const r = e.race;
      r.st.forEach((s, si) => { const w = s.rows[0]; if (w && w[0] === 1 && w[1] >= 0) wins.push({ d: r.multi ? addDays(r.start, Math.min(si, 30)) : r.start, rid: w[1], tid: w[2], r, k: 'st' }); });
      if (r.multi && r.cl.GC && r.cl.GC[0] && status(e).k !== 'live') wins.push({ d: r.end || r.start, rid: r.cl.GC[0][1], tid: r.cl.GC[0][2], r, k: 'GC' });
    }
    wins.sort((a, b) => a.d.localeCompare(b.d));
    const winsUntil = (rid, d) => wins.filter(w => w.rid === rid && w.d <= d).length;
    const teamWinsUntil = (tid, d) => wins.filter(w => w.tid === tid && w.d <= d).length;
    // récord de victorias en una temporada anterior
    let prevRec = { n: 0, rid: -1, y: 0 };
    for (const [yy, st] of IX.season) if (yy < y) for (const [rid, o] of st.riders) if (o.wins > prevRec.n) prevRec = { n: o.wins, rid, y: yy };

    for (const e of evs) {
      const r = e.race, live = status(e).k === 'live';
      const base = { d: r.end || r.start, ev: e, w: raceW(r) };
      if (r.multi && live) {
        const s = r.st[r.st.length - 1], sw = s.rows[0], gc = r.cl.GC || [], lead = gc[0];
        if (!sw) continue;
        const title = !lead ? pick(r.id + s.l, [`${sur(sw[1])} gana la ${esc(s.l.toLowerCase())} de ${esc(r.name)}`, `${esc(r.name)}: ${sur(sw[1])} se lleva la ${esc(s.l.toLowerCase())}`])
          : lead[1] !== sw[1]
          ? pick(r.id + s.l, [`${sur(sw[1])} gana la ${esc(s.l.toLowerCase())} de ${esc(r.name)}; ${sur(lead[1])} sigue líder`, `${esc(r.name)}: triunfo de ${sur(sw[1])} y ${sur(lead[1])} mantiene el liderato`])
          : pick(r.id + s.l, [`${sur(sw[1])} gana y manda en ${esc(r.name)}`, `Doble alegría para ${sur(sw[1])} en ${esc(r.name)}: etapa y liderato`]);
        let body = `${rlink(sw[1])} (${tlink(sw[2])}) se impuso en la ${esc(s.l.toLowerCase())}${s.ty ? ` (${esc((TYPE_LABEL[s.ty.split(' ')[0]] || s.ty).toLowerCase())})` : ''}${s.rows[1] ? `, por delante de ${rlink(s.rows[1][1])}${gapTxt(s.rows[1][3]) ? ' ' + gapTxt(s.rows[1][3]) : ''}` : ''}.`;
        if (lead) body += ` En la general, ${rlink(lead[1])} ${lead[1] === sw[1] ? 'se pone o sigue de líder' : 'conserva el maillot de líder'}${gc[1] ? ` con ${rlink(gc[1][1])} como segundo${gapTxt(gc[1][3]) ? ' ' + gapTxt(gc[1][3]) : ''}` : ''}.`;
        out.push({ ...base, d: addDays(r.start, r.st.length - 1) > (r.end || '9') ? r.end : addDays(r.start, r.st.length - 1), cat: 'vuelta', tag: 'En carrera', title, body, w: base.w + 1 });
        continue;
      }
      const win = winnerOf(r); if (!win || win[1] < 0) continue;
      const rid = win[1], tid = win[2];
      const pod = podiumOf(r);
      const nW = winsUntil(rid, base.d), nT = teamWinsUntil(tid, base.d);
      const g = H.byKey.get(r.hk || raceKey(r.name, r.cls));
      const prevEds = g ? g.eds.filter(x => x.s < y) : [];
      const lastEd = prevEds[prevEds.length - 1];
      const allWins = g ? (g.wins.get(rid) || []).length : 1;
      const rec = g && g.rec[0];
      const yng = young(rid, y);
      let title;
      if (r.multi) title = pick(r.id, [`${sur(rid)} conquista ${esc(r.name)}`, `${sur(rid)}, ganador de ${esc(r.name)}`, `${esc(r.name)} es para ${sur(rid)}`, `${sur(rid)} se lleva la general de ${esc(r.name)}`]);
      else if (/\.TT$/.test(r.cls || '')) title = pick(r.id, [`${sur(rid)} vuela en ${esc(r.name)}`, `${sur(rid)} gana ${esc(r.name)} contra el crono`]);
      else title = pick(r.id, [`${sur(rid)} gana ${esc(r.name)}`, `${sur(rid)} se impone en ${esc(r.name)}`, `Victoria de ${sur(rid)} en ${esc(r.name)}`, `${sur(rid)} levanta los brazos en ${esc(r.name)}`]);
      if (lastEd && lastEd.w && lastEd.w[1] === rid) title = `${sur(rid)} repite triunfo en ${esc(r.name)}`;
      const parts = [];
      const second = pod[1], third = pod[2];
      parts.push(`${yng ? 'El joven ' : ''}${rlink(rid)} (${tlink(tid)}) ${r.multi ? 'ganó la general de' : 'ganó'} ${evlink(e)}${second ? `, por delante de ${rlink(second[1])}${gapTxt(second[3]) ? ' ' + gapTxt(second[3]) : ''}${third ? ` y ${rlink(third[1])}` : ''}` : ''}.`);
      if (r.multi) {
        const sw = new Map(); r.st.forEach(s => { const w = s.rows[0]; if (w && w[0] === 1 && w[1] >= 0) sw.set(w[1], (sw.get(w[1]) || 0) + 1); });
        const top = [...sw.entries()].sort((a, b) => b[1] - a[1])[0];
        const jer = [['PTS', 'la regularidad'], ['KOM', 'la montaña'], ['YOU', 'los jóvenes']].map(([k, l]) => r.cl[k] && r.cl[k][0] && r.cl[k][0][1] >= 0 ? `${l} para ${rlink(r.cl[k][0][1])}` : '').filter(Boolean);
        if (jer.length) parts.push(`Los otros maillots: ${jer.join(', ')}.`);
        if (top && top[1] > 1) parts.push(`${rlink(top[0])} fue el más laureado con ${numW(top[1])} etapas.`);
        const ld = r.ld ? Object.values(r.ld).filter(x => x === rid).length : 0;
        if (ld > 1) parts.push(`${sur(rid)} vistió el maillot de líder ${ld} días.`);
      }
      if (nW === 1) parts.push(pick(r.id + 'a', [`Es su primera victoria de la temporada.`, `Estrena así su casillero de victorias en ${y}.`]));
      else if (nW >= 3) parts.push(pick(r.id + 'a', [`Ya suma ${nW} victorias en ${y}.`, `Es su ${ord(nW)} victoria de la temporada.`]));
      if (nT >= 5 && nT % 5 === 0) parts.push(`${tlink(tid)} alcanza las ${nT} victorias este año.`);
      if (g) {
        if (allWins > 1) parts.push(`Es su ${ord(allWins)} victoria en esta carrera${rec && rec[0] === rid && rec[1].length === allWins ? ', récord histórico de la prueba' : ''}.`);
        else if (lastEd && lastEd.w && lastEd.w[1] !== rid) parts.push(`Toma el relevo de ${rlink(lastEd.w[1])}, ganador en ${lastEd.s}.`);
        else if (!prevEds.length && IX.seasons.length > 1) parts.push(`Es la primera edición de la carrera en Managercycling.`);
      }
      out.push({ ...base, cat: r.multi ? 'vuelta' : 'race', tag: r.multi ? 'Vuelta' : /^NC/.test(r.cls || '') ? 'Campeonato' : 'Clásica', title, body: parts.join(' '), w: base.w + (nW === 1 ? 1 : 0) });
    }

    // ranking semanal (domingo a domingo)
    const lastDate = evs.reduce((m, e) => { const d = status(e).k === 'live' ? TODAY : (e.race.end || e.race.start); return d > m ? d : m; }, '');
    if (lastDate) {
      const ptsAt = []; // [fecha, rid, tid, pts]
      for (const e of evs) {
        const r = e.race;
        r.st.forEach((s, si) => s.rows.forEach(w => { if (w[4]) ptsAt.push([r.multi ? addDays(r.start, Math.min(si, 30)) : r.start, w[1], w[2], w[4]]); }));
        for (const k of ['GC', 'PTS', 'KOM', 'YOU', 'LDR', 'TEAM']) (r.cl[k] || []).forEach(w => { if (w[4]) ptsAt.push([r.end || r.start, k === 'TEAM' ? -1 : w[1], w[2], w[4]]); });
      }
      const sunday = d => { const x = new Date(d + 'T12:00:00Z'); return addDays(d, (7 - x.getUTCDay()) % 7); };
      let end = sunday(lastDate); if (end > TODAY) end = addDays(end, -7);
      let prevLeader = null;
      const weeks = [];
      for (let k = 0, wEnd = end; k < 12; k++, wEnd = addDays(wEnd, -7)) weeks.unshift(wEnd);
      for (const wEnd of weeks) {
        const wStart = addDays(wEnd, -6);
        const tot = new Map(), wk = new Map(), tw = new Map();
        for (const [d, rid, tid, p] of ptsAt) { if (d > wEnd) continue; if (rid >= 0) tot.set(rid, (tot.get(rid) || 0) + p); if (d >= wStart) { if (rid >= 0) wk.set(rid, (wk.get(rid) || 0) + p); if (tid >= 0) tw.set(tid, (tw.get(tid) || 0) + p); } }
        if (!wk.size) continue;
        const rk = [...tot.entries()].sort((a, b) => b[1] - a[1]);
        const [L, l1] = rk[0], S = rk[1];
        const gain = [...wk.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);
        const tBest = [...tw.entries()].sort((a, b) => b[1] - a[1])[0];
        const changed = prevLeader != null && prevLeader !== L;
        const title = changed ? `${sur(L)} arrebata el liderato del ranking a ${sur(prevLeader)}`
          : pick(wEnd, [`${sur(L)} sigue al frente del ranking`, `El ranking, semana a semana: ${sur(L)} manda`, `${sur(L)} mantiene el número 1`]);
        let body = `Tras la semana del ${dshort(wStart)} al ${dshort(wEnd)}, ${rlink(L)} lidera el ranking ${y} con ${fmtN(l1)} puntos MC${S ? `, ${fmtN(l1 - S[1])} más que ${rlink(S[0])}` : ''}.`;
        body += ` El que más sumó en la semana fue ${rlink(gain[0][0])} (${fmtN(gain[0][1])} puntos)${gain[1] ? `, seguido de ${rlink(gain[1][0])} (${fmtN(gain[1][1])})${gain[2] ? ` y ${rlink(gain[2][0])} (${fmtN(gain[2][1])})` : ''}` : ''}.`;
        if (tBest) body += ` Equipo de la semana: ${tlink(tBest[0])}, con ${fmtN(tBest[1])} puntos.`;
        out.push({ d: wEnd, cat: 'rank', tag: 'Ranking', title, body, w: changed ? 9 : 5 });
        prevLeader = L;
      }
    }

    // récords y límites de la temporada (estado actual)
    const st = IX.season.get(y);
    if (st && lastDate) {
      const top = [...st.riders.entries()].sort((a, b) => b[1].wins - a[1].wins)[0];
      if (top && prevRec.n && top[1].wins >= prevRec.n) {
        out.push({ d: lastDate, cat: 'rec', tag: 'Récord', w: 9,
          title: top[1].wins > prevRec.n ? `${sur(top[0])} bate el récord de victorias en una temporada` : `${sur(top[0])} iguala el récord de victorias en una temporada`,
          body: `${rlink(top[0])} suma ${top[1].wins} victorias en ${y}. El récord anterior era de ${prevRec.n}, de ${rlink(prevRec.rid)} en ${prevRec.y}.` });
      }
      const full = [...st.riders.entries()].filter(([, o]) => o.days >= MAX_DAYS).map(([rid]) => rid);
      const near = [...st.riders.entries()].filter(([, o]) => o.days < MAX_DAYS && o.days + (o.planned || 0) > MAX_DAYS).map(([rid]) => rid);
      if (full.length || near.length) out.push({ d: lastDate, cat: 'rec', tag: 'Días', w: 4,
        title: full.length ? `${full.length} corredor${full.length > 1 ? 'es han' : ' ha'} agotado sus ${MAX_DAYS} días de competición` : `Corredores en riesgo de pasarse del límite de días`,
        body: `${full.length ? `Ya no pueden correr más este año: ${full.slice(0, 12).map(r => rlink(r)).join(', ')}${full.length > 12 ? ` y ${full.length - 12} más` : ''}.` : ''}${near.length ? ` Inscritos por encima del máximo: ${near.slice(0, 10).map(r => rlink(r)).join(', ')}.` : ''}` });
    }

    // previa: carreras de los próximos 7 días
    if (y === IX.seasons[0]) {
      const soon = IX.events.filter(e => e.s === y && e.ins && !(e.race && e.race.st.length) && e.start >= TODAY && e.start <= addDays(TODAY, 7));
      for (const e of soon) {
        const riders = e.ins.e.flatMap(x => x.r);
        const fav = riders.map(rid => [rid, st && st.riders.get(rid) ? st.riders.get(rid).pts : 0]).sort((a, b) => b[1] - a[1]).slice(0, 3).filter(x => x[1] > 0);
        const g = H.byKey.get(raceKey(e.name, e.cls)), lw = g && g.eds[g.eds.length - 1];
        out.push({ d: TODAY, ev: e, cat: 'prev', tag: 'Previa', w: raceW({ cls: e.cls }),
          title: pick(e.id, [`Previa: ${esc(e.name)}`, `Llega ${esc(e.name)}`, `${esc(e.name)}, a la vista`]),
          body: `${evlink(e)} arranca ${e.start === TODAY ? 'hoy' : 'el ' + dshort(e.start)} con ${e.ins.e.length} equipos y ${riders.length} corredores inscritos.${fav.length ? ` Los favoritos por puntos esta temporada: ${fav.map(([rid]) => rlink(rid)).join(', ')}.` : ''}${lw && lw.w ? ` Último ganador: ${rlink(lw.w[1])} (${lw.s}).` : ''}` });
      }
    }
    // mercado: cada acuerdo confirmado
    if (D.market && y === IX.seasons[0] && st) {
      const ridOfOid = new Map(Object.entries(D.oid || {}).map(([r, o]) => [o, +r]));
      const groups = new Map(); for (const x of D.market.transfers) { if (!groups.has(x[5])) groups.set(x[5], []); groups.get(x[5]).push(x); }
      for (const g of groups.values()) {
        const items = g.map(x => { const rid = ridOfOid.get(x[1]); const o = rid != null ? st.riders.get(rid) : null; return { x, rid, pts: o ? o.pts : 0 }; }).sort((a, b) => b.pts - a.pts);
        const star = items[0], teams = [...new Set(g.flatMap(x => [x[3], x[4]]))];
        const nm = it => it.rid != null ? rlink(it.rid) : esc(it.x[2]);
        out.push({ d: g[0][0], cat: 'merc', tag: 'Mercado', w: 5,
          title: items.length === 1 ? `${esc(star.x[2].replace(/\s*\(J\)/, ''))} ficha por ${esc(star.x[4])}` : `${esc(star.x[2].replace(/\s*\(J\)/, ''))}${items.length > 1 ? ` y ${items.length - 1} más` : ''}: acuerdo entre ${teams.map(esc).join(' y ')}`,
          body: `Traspaso confirmado para ${D.market.year}: ${items.map(it => `${nm(it)} (${esc(it.x[3])} → ${esc(it.x[4])}${it.pts ? `, ${fmtN(it.pts)} pts en ${y}` : ''})`).join('; ')}. <a href="#mercado">Cómo habría quedado ${y} con los cambios</a>.` });
      }
    }
    out.sort((a, b) => b.d.localeCompare(a.d) || b.w - a.w);
    NX = { ix: IX, y, list: out };
    return out;
  }

  // ---------- head to head ----------

    let wa = 0, wb = 0, n = 0; const list = [];

      const o = pos.get(e.r.id + ':' + e.k + ':' + (e.si ?? ''));
      if (!o || o.p == null || e.p == null || o.p === e.p) continue;
      n++; if (o.p < e.p) wa++; else wb++;
      if (e.k === 'GC' || !e.r.multi) list.push({ r: e.r, k: e.k, pa: o.p, pb: e.p });

        ...teams.map(([t, i]) => ({ h: `#equipo-${IX.teamSlug[i]}`, html: `<span class="qk">Equipo</span>${esc(t)}` }))];
      sel = items.length ? 0 : -1;
      box.innerHTML = items.length ? items.map((it, i) => `<a href="${it.h}" class="${i === sel ? 'on' : ''}">${it.html}</a>`).join('') : '<p class="empty">Sin coincidencias</p>';
      box.hidden = false;
    };
    inp.addEventListener('input', run);
    inp.addEventListener('focus', run);
    inp.addEventListener('keydown', e => {
      if (box.hidden) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; [...box.querySelectorAll('a')].forEach((a, i) => a.classList.toggle('on', i === sel)); }
      if (e.key === 'Enter' && items[sel]) { e.preventDefault(); state.raceTab = null; state.hl = null; location.hash = items[sel].h; box.hidden = true; inp.blur(); }
      if (e.key === 'Escape') { box.hidden = true; inp.blur(); }
    });
    box.addEventListener('click', e => { if (e.target.closest('a')) { box.hidden = true; inp.value = ''; state.raceTab = null; state.hl = null; } });
    document.addEventListener('click', e => { if (!e.target.closest('.search')) box.hidden = true; });
  }

  // ---------- live update from the forum ----------
  const LIVE_KEY = 'mcs.live.v2';
  function applyCachedLive() {
    const raw = ls.get(LIVE_KEY);
    if (!raw) return;
    try {
      const c = JSON.parse(raw);
      if (c.base !== D.generated || !Array.isArray(c.topics) || !c.topics.length) return;
      mergeTopics(c.topics);
      D.liveAt = c.at;
    } catch (e) { ls.del(LIVE_KEY); }
  }
  function mergeTopics(topics) {
    const comp = MCBuild.Compactor({ v: 2, seasons: D.seasons, teams: D.teams, riders: D.riders, races: [], ins: [] });
    MCBuild.ingest(comp, topics);
    const out = comp.finish();
    D.teams = out.teams; D.riders = out.riders;
    for (const r of out.races) { if ((D.offSeasons || []).includes(r.s)) continue; const i = D.races.findIndex(x => x.id === r.id); if (i >= 0) D.races[i] = r; else D.races.push(r); }
    for (const x of out.ins) { const i = D.ins.findIndex(y => y.id === x.id); if (i >= 0) D.ins[i] = x; else D.ins.push(x); }
    D.races.sort((a, b) => (a.start || '').localeCompare(b.start || ''));
    D.ins.sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  }
  const hhmm = d => d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  const dataLabel = () => { const g = D.generated ? new Date(D.generated) : null; return g ? `Datos del ${g.toLocaleDateString('es-ES')} ${hhmm(g)}` : 'Datos guardados'; };
  // última novedad de la web oficial que ya está en los datos (el servidor la comprueba cada 10 minutos)
  // Estado frente a la web oficial: cuándo la comprobó el servidor por última vez (GitHub Actions, API pública)
  // y cuál es el último resultado que hay. Así se ve que está al día aunque la oficial no publique nada nuevo.
  const REPO = CONFIG.repo || 'opeze90-png/managercycling-stats';
  let lastCheck = null;
  async function serverCheck() {
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/actualizar.yml/runs?per_page=1&status=success`, { cache: 'no-store' });
      if (!r.ok) return null;
      const j = await r.json(); const w = j.workflow_runs && j.workflow_runs[0];
      if (w) lastCheck = new Date(w.updated_at || w.run_started_at);
    } catch (e) { /* sin conexión con GitHub: se usa lo que hay */ }
    return lastCheck;
  }
  const ago = d => { const m = Math.round((Date.now() - d) / 60000); return m < 1 ? 'ahora mismo' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `el ${d.toLocaleDateString('es-ES', { day: 'numeric', month: 'numeric' })}`; };
  const lastResult = () => {
    const ys = Object.keys(D.official || {}); if (!ys.length) return null;
    const y = Math.max(...ys);
    const evs = IX ? IX.events.filter(e => e.s === y && e.race && e.race.o) : [];
    let best = null;
    for (const e of evs) { const r = e.race, d = status(e).k === 'live' ? addDays(r.start, r.st.length - 1) : (r.end || r.start); if (!best || d > best.d || (d === best.d && r.o > best.r.o)) best = { d, r }; }
    return best;
  };
  const offLabel = fresh => {
    const ys = Object.keys(D.official || {}); if (!ys.length) return '';
    const lr = lastResult();
    const chk = lastCheck ? `comprobada ${ago(lastCheck)}` : '';
    const last = lr ? `último resultado: ${lr.r.name}${lr.r.multi && lr.r.st.length ? ' (' + lr.r.st[lr.r.st.length - 1].l.toLowerCase() + ')' : ''} · ${dshort(lr.d)}` : '';
    return [`${fresh ? 'Datos nuevos de la web oficial' : 'Al día con la web oficial'}${chk ? ' (' + chk + ')' : ''}`, last].filter(Boolean).join(' · ');
  };
  let updating = false;
  function setBtn(busy) { const b = $('#refresh'); if (b) { b.disabled = busy; b.classList.toggle('busy', busy); } }
  // Newer snapshot published (GitHub Action)? Reload the data files.
  async function refreshSnapshot() {
    try {
      const core = await getJSON('data/core.json');
      if (!core.generated || core.generated === D.generated) return false;
      await loadData();
      return true;
    } catch (e) { return false; }
  }
  async function liveUpdate(manual = false) {
    if (updating || !window.MCForum || CONFIG.live === false) return;
    updating = true; setBtn(true);
    try {
      if (manual) setLive('busy', 'Conectando con la web oficial…');
      const [fresh] = await Promise.all([refreshSnapshot(), serverCheck()]);
      if (fresh) { state.scrollTop = false; route(); }
      const forum = await checkForum(manual);
      setLive(forum.err && !offLabel() ? 'off' : 'ok', [offLabel(fresh) || dataLabel(), forum.msg].filter(Boolean).join(' · '));
    } finally { updating = false; setBtn(false); }
  }
  async function checkForum(manual) {
    setLive('busy', 'Comprobando inscripciones del foro…');
    const F = MCForum.Forum({ gap: 650, on429: 'stop', tries: 2 });
    const known = new Map();
    D.races.forEach(r => known.set('res' + r.id, r.rp));
    D.ins.forEach(i => known.set('ins' + i.id, i.rp));
    let cached = [];
    try { const c = JSON.parse(ls.get(LIVE_KEY) || 'null'); if (c && c.base === D.generated) cached = c.topics || []; } catch (e) { }
    cached.forEach(t => known.set(t.t.kind + t.id, t.t.replies));
    try {
      const changed = [];
      for (const [kind, fid] of [['res', CUR_FORUMS.res], ['ins', CUR_FORUMS.ins]]) {
        if (kind === 'res' && (D.offSeasons || []).includes(Math.max(...(D.seasons || [0])))) continue; // resultados: de la web oficial
        const stopAt = page => page.length > 0 && page.every(t => known.has(kind + t.id) && known.get(kind + t.id) === t.replies);
        const ts = await F.forumTopics(fid, { maxPages: 6, stopAt });
        for (const t of ts) if (/^\d/.test(t.title) && known.get(kind + t.id) !== t.replies) changed.push({ t, kind });
      }
      if (!changed.length) return { msg: '' };
      const todo = changed.slice(0, manual ? 80 : 40);
      const got = [];
      let n = 0;
      for (const { t, kind } of todo) {
        setLive('busy', `Actualizando ${++n}/${todo.length} temas del foro…`);
        try { got.push(await F.topic(t, kind)); } catch (e) { if (/429|stopped/.test(e.message)) break; }
      }
      if (got.length) {
        mergeTopics(got);
        const keep = new Map(cached.map(t => [t.t.kind + t.id, t]));
        got.forEach(t => keep.set(t.t.kind + t.id, t));
        ls.set(LIVE_KEY, JSON.stringify({ base: D.generated, at: Date.now(), topics: [...keep.values()].slice(-80) }));
        rebuild(); state.scrollTop = false; route();
      }
      const left = changed.length - got.length;
      return { msg: left > 0 ? `${got.length} inscripciones del foro actualizadas, quedan ${left}` : got.length ? `${got.length} inscripcion${got.length > 1 ? 'es' : ''} nueva${got.length > 1 ? 's' : ''} del foro` : '' };
    } catch (e) {
      const inClaude = /claude/i.test(location.hostname);
      return { err: 1, msg: manual && !inClaude ? 'foro no disponible ahora' : '' };
    }
  }
  document.addEventListener('click', e => { if (e.target.closest('#refresh')) liveUpdate(true); });

  // ---------- boot ----------
  async function boot() {
    setupSearch();
    try { await loadData(); }
    catch (e) {
      const first = /core\.json 404/.test(e.message);
      $('#main').innerHTML = first
        ? `<section class="card"><h1 class="h2">Preparando la web por primera vez</h1><p>Se están descargando todas las temporadas del foro. Tarda aproximadamente una hora; vuelve a abrir la página más tarde.</p></section>`
        : `<section class="card"><h1 class="h2">No se pudieron cargar los datos</h1><p class="muted">${esc(e.message)}</p></section>`;
      setLive('off', first ? 'Preparando datos…' : 'Sin datos');
      return;
    }
    setLive('off', dataLabel());
    route();
    setTimeout(() => liveUpdate(false), 1200);
    // mientras la web está abierta, carga sola lo que el servidor traiga de la web oficial
    setInterval(() => { if (!updating && document.visibilityState === 'visible') refreshSnapshot().then(f => { if (f) { state.scrollTop = false; route(); setLive('ok', offLabel(true)); } }); }, 5 * 60000);
  }
  boot();
})();

</script>
