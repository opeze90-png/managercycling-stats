name: Actualizar datos del foro

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo algunos minutos)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
  push:
    paths:
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer temas nuevos del foro y reconstruir los datos
        env:
          MAX_MINUTES: "320"
        run: node scripts/update.js
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "managercycling-stats"
          git config user.email "actions@users.noreply.github.com"
          git add data raw || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -q -m "Datos actualizados $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase -q || true
            git push
          fi
